name: M1.3b.4b.5c AROS reversible runtime preflight

on:
  workflow_dispatch:
  push:
    paths:
      - 'loader/aros/m68kdeb-loader.c'
      - 'loader/aros/m68kdeb-layout.c'
      - 'loader/aros/m68kdeb-layout.h'
      - 'loader/aros/m68kdeb-handoff.c'
      - 'loader/aros/m68kdeb-handoff.h'
      - 'loader/aros/m68kdeb-takeover.c'
      - 'loader/aros/m68kdeb-takeover.h'
      - 'kernel/build-amiga.sh'
      - 'initramfs/build-amiga.sh'
      - 'ci/fs-uae/fetch-aros-m68k-nightly.sh'
      - 'ci/fs-uae/prepare-m1_3b4b5c-preflight.sh'
      - 'ci/fs-uae/m1_3b4b5c_aros_a1200_preflight.fs-uae'
      - '.github/workflows/m1_3b4b5c-aros-runtime-preflight.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl file flex \
            fs-uae gcc-m68k-linux-gnu gzip libelf-dev libssl-dev make \
            scrot unzip xvfb xorriso xz-utils
          fs-uae --version
          docker --version

      - name: Build Linux 7.2 Amiga kernel
        run: sh kernel/build-amiga.sh

      - name: Build m68kDeb initramfs
        run: sh initramfs/build-amiga.sh

      - name: Build reversible takeover-preflight loader
        run: |
          mkdir -p out/m68kdeb-loader
          docker pull amigadev/m68k-amigaos-gcc:latest
          docker run --rm -v "$PWD:/work" -w /work \
            amigadev/m68k-amigaos-gcc:latest sh -lc '
              set -eu
              find / -type f \( -name "m68k-amigaos-gcc" -o -name "*amigaos*gcc" -o -name "m68k-*-gcc" \) 2>/dev/null | sort > /tmp/compiler-candidates.txt
              CC=$(awk "/\/m68k-amigaos-gcc$/ { print; exit }" /tmp/compiler-candidates.txt)
              if [ -z "$CC" ]; then CC=$(head -n 1 /tmp/compiler-candidates.txt || true); fi
              test -n "$CC" && test -x "$CC"
              echo "compiler_path=$CC" | tee /work/out/m68kdeb-loader/TOOLCHAIN.txt
              "$CC" --version | head -n 3 | tee -a /work/out/m68kdeb-loader/TOOLCHAIN.txt
              "$CC" \
                loader/aros/m68kdeb-loader.c \
                loader/aros/m68kdeb-layout.c \
                loader/aros/m68kdeb-handoff.c \
                loader/aros/m68kdeb-takeover.c \
                -o out/m68kdeb-loader/m68kdeb-loader \
                -m68000 -Os -Wall -Wextra -Werror \
                -Wno-error=pointer-sign -Wno-error=int-conversion \
                -noixemul
            '
          strings out/m68kdeb-loader/m68kdeb-loader | grep -q 'M68KDEB_TAKEOVER_PREFLIGHT_OK'
          strings out/m68kdeb-loader/m68kdeb-loader | grep -q 'handoff=NOT_ATTEMPTED'
          if strings out/m68kdeb-loader/m68kdeb-loader | grep -q 'm68kdeb_takeover_68030_commit'; then
            echo 'irreversible commit path unexpectedly linked into runtime loader' >&2
            exit 1
          fi
          sha256sum out/m68kdeb-loader/m68kdeb-loader | tee out/m68kdeb-loader/SHA256SUMS

      - name: Prepare matching AROS runtime
        run: sh ci/fs-uae/prepare-m1_3b4b5c-preflight.sh

      - name: Run reversible takeover preflight under FS-UAE
        run: |
          set +e
          xvfb-run -a sh -eu -c '
            fs-uae ci/fs-uae/m1_3b4b5c_aros_a1200_preflight.fs-uae >out/m1-3b4b5c/fs-uae.stdout.log 2>&1 &
            emu=$!
            startup=0
            returned=0
            report=0
            for i in $(seq 1 240); do
              [ -f out/m1-3b4b5c/aros-root/m1-3b4b5c-startup.marker ] && startup=1
              [ -f out/m1-3b4b5c/aros-root/m1-3b4b5c-returned.marker ] && returned=1
              if [ -f out/m1-3b4b5c/aros-root/m68kdeb-preflight-report.txt ] && \
                 grep -q "M68KDEB_INITRAMFS_LOADED" out/m1-3b4b5c/aros-root/m68kdeb-preflight-report.txt && \
                 grep -q "takeover_preflight_rc=0" out/m1-3b4b5c/aros-root/m68kdeb-preflight-report.txt && \
                 grep -q "M68KDEB_TAKEOVER_PREFLIGHT_OK" out/m1-3b4b5c/aros-root/m68kdeb-preflight-report.txt && \
                 grep -q "handoff=NOT_ATTEMPTED" out/m1-3b4b5c/aros-root/m68kdeb-preflight-report.txt && \
                 grep -q "M68KDEB_BOOTINFO_BUILD_OK" out/m1-3b4b5c/aros-root/m68kdeb-preflight-report.txt && \
                 ! grep -q "M68KDEB_TAKEOVER_COMMIT" out/m1-3b4b5c/aros-root/m68kdeb-preflight-report.txt; then
                report=1
              fi
              [ "$startup" -eq 1 ] && [ "$returned" -eq 1 ] && [ "$report" -eq 1 ] && break
              if ! kill -0 "$emu" 2>/dev/null; then break; fi
              sleep 1
            done
            scrot out/m1-3b4b5c/screenshots/m1-3b4b5c-preflight.png || true
            kill -INT "$emu" 2>/dev/null || true
            sleep 2
            kill -TERM "$emu" 2>/dev/null || true
            wait "$emu" 2>/dev/null || true
            printf "startup=%s\nreturned=%s\nreport_valid=%s\n" "$startup" "$returned" "$report" >out/m1-3b4b5c/BOUNDARIES.txt
            [ "$startup" -eq 1 ] && [ "$returned" -eq 1 ] && [ "$report" -eq 1 ]
          '
          rc=$?
          set -e

          REPORT=out/m1-3b4b5c/aros-root/m68kdeb-preflight-report.txt
          cat "$REPORT" || true
          if [ "$rc" -eq 0 ]; then
            layout_base=$(sed -n 's/^layout_base=0x\([0-9a-fA-F]*\)$/\1/p' "$REPORT" | head -n1)
            layout_bytes=$(sed -n 's/^layout_bytes=\([0-9]*\)$/\1/p' "$REPORT" | head -n1)
            bootinfo=$(sed -n 's/^bootinfo_addr=0x\([0-9a-fA-F]*\)$/\1/p' "$REPORT" | head -n1)
            initramfs=$(sed -n 's/^takeover_initramfs=0x\([0-9a-fA-F]*\)$/\1/p' "$REPORT" | head -n1)
            test -n "$layout_base" && test -n "$layout_bytes" && test -n "$bootinfo" && test -n "$initramfs"
            test $((0x$bootinfo)) -eq $((0x$layout_base + layout_bytes))
            test $((0x$initramfs)) -ne 0
            echo 'classification=AROS_REVERSIBLE_TAKEOVER_PREFLIGHT_PASS' >out/m1-3b4b5c/CLASSIFICATION.txt
          else
            echo 'classification=AROS_REVERSIBLE_TAKEOVER_PREFLIGHT_FAIL' >out/m1-3b4b5c/CLASSIFICATION.txt
          fi
          cat out/m1-3b4b5c/BOUNDARIES.txt || true
          cat out/m1-3b4b5c/CLASSIFICATION.txt || true
          tail -200 out/m1-3b4b5c/fs-uae.stdout.log || true
          exit "$rc"

      - name: Record qualification PASS
        run: |
          {
            echo 'result=PASS'
            echo "git=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo 'scope=reversible A1200 68030+MMU takeover preflight only; irreversible commit object not linked or executed'
            cat out/m68kdeb-loader/TOOLCHAIN.txt
            cat out/m1-3b4b5c/CLASSIFICATION.txt
            cat out/m1-3b4b5c/BOUNDARIES.txt
            cat out/m1-3b4b5c/RUNTIME_PROVENANCE.txt
            cat out/m68kdeb-loader/SHA256SUMS
          } >out/m1-3b4b5c/RESULT.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-3b4b5c-aros-runtime-${{ github.sha }}
          path: |
            out/m1-3b4b5c/RESULT.txt
            out/m1-3b4b5c/BOUNDARIES.txt
            out/m1-3b4b5c/CLASSIFICATION.txt
            out/m1-3b4b5c/RUNTIME_PROVENANCE.txt
            out/m1-3b4b5c/ORIGINAL-Startup-Sequence
            out/m1-3b4b5c/aros-fetch/SOURCE_URL
            out/m1-3b4b5c/aros-fetch/SHA256SUMS
            out/m1-3b4b5c/aros-fetch/ISO_SHA256
            out/m1-3b4b5c/aros-root/S/Startup-Sequence
            out/m1-3b4b5c/aros-root/m1-3b4b5c-*.marker
            out/m1-3b4b5c/aros-root/m68kdeb-preflight-report.txt
            out/m1-3b4b5c/fs-uae.stdout.log
            out/m1-3b4b5c/logs/
            out/m1-3b4b5c/screenshots/
            out/m1-3b4b5c/rom/
            out/m68kdeb-loader/TOOLCHAIN.txt
            out/m68kdeb-loader/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
