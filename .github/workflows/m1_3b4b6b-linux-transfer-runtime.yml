name: M1.3b.4b.6b Linux transfer runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1_3b4b6b-linux-transfer-runtime.yml'
      - 'ci/fs-uae/m1_3b4b6b_aros_a1200_linux_transfer.fs-uae'
      - 'ci/fs-uae/prepare-m1_3b4b6b-linux-transfer.sh'
      - 'loader/aros/m68kdeb-loader-68030-linux-transfer-qual.c'
      - 'loader/aros/m68kdeb-layout.c'
      - 'loader/aros/m68kdeb-layout.h'
      - 'loader/aros/m68kdeb-takeover-68030-linux-trampoline.S'
      - 'loader/aros/m68kdeb-68030-transition-entry-call.S'
      - 'loader/aros/m68kdeb-68030-takeover-identity.c'
      - 'loader/aros/m68kdeb-68030-takeover-identity.h'
      - 'kernel/**'
      - 'initramfs/**'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl file flex \
            fs-uae gcc-m68k-linux-gnu gzip libelf-dev libssl-dev make \
            netcat-openbsd python3 unzip xvfb xorriso xz-utils lhasa
          fs-uae --version
          docker --version

      - name: Build qualified Amiga kernel and initramfs
        run: |
          sh kernel/build-amiga.sh
          sh initramfs/build-amiga.sh
          test -s out/kernel-amiga/vmlinux-m68k-amiga
          test -s out/initramfs-amiga/initramfs-m68kdeb.gz

      - name: Build exact Linux transfer trampoline blob
        run: |
          mkdir -p out/m1-3b4b6b
          docker pull amigadev/m68k-amigaos-gcc:latest
          docker run --rm -v "$PWD:/work" -w /work amigadev/m68k-amigaos-gcc:latest sh -lc '
            set -eu
            CC=$(find / -type f -name "m68k-amigaos-gcc" 2>/dev/null | head -n 1)
            NM=$(find / -type f -name "m68k-amigaos-nm" 2>/dev/null | head -n 1)
            OBJCOPY=$(find / -type f -name "m68k-amigaos-objcopy" 2>/dev/null | head -n 1)
            OBJDUMP=$(find / -type f -name "m68k-amigaos-objdump" 2>/dev/null | head -n 1)
            "$CC" -x assembler-with-cpp -c loader/aros/m68kdeb-takeover-68030-linux-trampoline.S \
              -o out/m1-3b4b6b/linux-trampoline.o -m68030 -m68851
            "$NM" -n out/m1-3b4b6b/linux-trampoline.o > out/m1-3b4b6b/linux-trampoline.nm
            "$OBJDUMP" -r out/m1-3b4b6b/linux-trampoline.o > out/m1-3b4b6b/linux-trampoline.relocs.txt
            "$OBJDUMP" -d out/m1-3b4b6b/linux-trampoline.o > out/m1-3b4b6b/linux-trampoline.disasm.txt
            "$OBJCOPY" -O binary -j .text out/m1-3b4b6b/linux-trampoline.o out/m1-3b4b6b/linux-trampoline.bin
          '
          ! grep -Eq '^[[:space:]]*[0-9a-fA-F]+[[:space:]]+R_' out/m1-3b4b6b/linux-trampoline.relocs.txt
          python3 - <<'PY'
          from pathlib import Path
          names = {
              'entry': 'm68kdeb_takeover_68030_linux_entry',
              'mmu_off': 'm68kdeb_takeover_68030_linux_mmu_off',
              'post_mmu': 'm68kdeb_takeover_68030_linux_post_mmu',
              'jump': 'm68kdeb_takeover_68030_linux_jump',
              'tc_zero': 'm68kdeb_takeover_68030_linux_tc_zero',
              'end': 'm68kdeb_takeover_68030_linux_end',
          }
          syms = {}
          for line in Path('out/m1-3b4b6b/linux-trampoline.nm').read_text().splitlines():
              p = line.split()
              if len(p) >= 3:
                  for key, name in names.items():
                      if p[2] == name:
                          syms[key] = int(p[0], 16)
          assert set(syms) == set(names), syms
          data = Path('out/m1-3b4b6b/linux-trampoline.bin').read_bytes()
          assert 0 < len(data) <= 4096
          assert syms['entry'] == 0
          assert syms['entry'] < syms['mmu_off'] < syms['post_mmu'] < syms['jump'] < syms['tc_zero'] < syms['end'] <= len(data)
          assert data[syms['tc_zero']:syms['tc_zero']+4] == b'\x00\x00\x00\x00'
          body = ','.join(f'0x{x:02x}' for x in data)
          fields = ''.join(
              f'unsigned int m68kdeb_linux_trampoline_{key}_offset={value};\n'
              for key, value in syms.items())
          Path('out/m1-3b4b6b/linux-trampoline-blob.c').write_text(
              'unsigned char m68kdeb_linux_trampoline_blob[]={' + body + '};\n'
              'unsigned int m68kdeb_linux_trampoline_blob_len=sizeof(m68kdeb_linux_trampoline_blob);\n' + fields)
          PY
          grep -Eqi 'movec.*cacr|cacr.*movec' out/m1-3b4b6b/linux-trampoline.disasm.txt
          grep -Eqi 'pmove.*tc|tc.*pmove' out/m1-3b4b6b/linux-trampoline.disasm.txt
          grep -Eqi 'pflusha' out/m1-3b4b6b/linux-trampoline.disasm.txt
          grep -Eqi 'jmp.*\(?%?a1\)?' out/m1-3b4b6b/linux-trampoline.disasm.txt

      - name: Build 6b qualification loader
        run: |
          docker run --rm -v "$PWD:/work" -w /work amigadev/m68k-amigaos-gcc:latest sh -lc '
            set -eu
            CC=$(find / -type f -name "m68k-amigaos-gcc" 2>/dev/null | head -n 1)
            NM=$(find / -type f -name "m68k-amigaos-nm" 2>/dev/null | head -n 1)
            "$CC" \
              loader/aros/m68kdeb-loader-68030-linux-transfer-qual.c \
              loader/aros/m68kdeb-layout.c loader/aros/m68kdeb-handoff.c \
              loader/aros/m68kdeb-takeover.c \
              loader/aros/m68kdeb-68030-takeover-identity.c \
              loader/aros/m68kdeb-68030-identity-window.c \
              loader/aros/m68kdeb-physwin.c loader/aros/m68kdeb-68030-mmu-state.S \
              loader/aros/m68kdeb-68030-transition-entry-call.S \
              out/m1-3b4b6b/linux-trampoline-blob.c \
              -o out/m1-3b4b6b/m68kdeb-loader-68030-linux-transfer-qual \
              -m68030 -Os -Wall -Wextra -Werror \
              -Wno-error=pointer-sign -Wno-error=int-conversion -noixemul
            "$NM" out/m1-3b4b6b/m68kdeb-loader-68030-linux-transfer-qual > out/m1-3b4b6b/loader.nm
          '
          strings out/m1-3b4b6b/m68kdeb-loader-68030-linux-transfer-qual | grep -q 'M68KDEB_6B_LINUX_TRANSFER_ARMED'
          strings out/m1-3b4b6b/m68kdeb-loader-68030-linux-transfer-qual | grep -q 'M68KDEB_6B_UNEXPECTED_RETURN'
          ! grep -Eq '[[:space:]][Tt][[:space:]]_?m68kdeb_takeover_68030_commit$' out/m1-3b4b6b/loader.nm
          grep -Eq '[[:space:]][Tt][[:space:]]_?m68kdeb_68030_jump_transition_entry$' out/m1-3b4b6b/loader.nm

      - name: Prepare AROS FS-UAE runtime
        run: sh ci/fs-uae/prepare-m1_3b4b6b-linux-transfer.sh

      - name: Capture serial and run FS-UAE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/m1-3b4b6b/logs
          : > out/m1-3b4b6b/serial.log

          xvfb-run -a fs-uae ci/fs-uae/m1_3b4b6b_aros_a1200_linux_transfer.fs-uae \
            >out/m1-3b4b6b/fs-uae.stdout.log \
            2>out/m1-3b4b6b/fs-uae.stderr.log &
          emu_pid=$!

          for _ in $(seq 1 60); do
            if nc -z 127.0.0.1 12345; then
              break
            fi
            if ! kill -0 "$emu_pid" 2>/dev/null; then
              echo 'FS-UAE exited before serial port became available' >&2
              wait "$emu_pid" || true
              exit 1
            fi
            sleep 1
          done

          timeout 240 nc 127.0.0.1 12345 > out/m1-3b4b6b/serial.log || true
          kill -INT "$emu_pid" 2>/dev/null || true
          sleep 2
          kill -TERM "$emu_pid" 2>/dev/null || true
          wait "$emu_pid" 2>/dev/null || true

      - name: Qualify Linux userspace handoff
        shell: bash
        run: |
          set -euo pipefail
          report=out/m1-3b4b6b/aros-root/m68kdeb-6b-report.txt
          serial=out/m1-3b4b6b/serial.log
          returned=out/m1-3b4b6b/aros-root/m1-3b4b6b-returned.marker
          armed=out/m1-3b4b6b/aros-root/m1-3b4b6b-linux-transfer-armed.marker

          test -f "$report"
          test -f "$armed"
          test ! -e "$returned"
          grep -Fq 'M68KDEB_6B_LINUX_TRANSFER_ARMED' "$report"
          grep -Fq 'm68kDeb installer bootstrap' "$serial"
          grep -Fq 'M1.3 bootstrap reached userspace.' "$serial"

          echo 'PASS: M1.3b.4b.6b Linux transfer reached installer initramfs userspace'

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-3b4b6b-linux-transfer-evidence
          if-no-files-found: warn
          path: |
            out/m1-3b4b6b/serial.log
            out/m1-3b4b6b/fs-uae.stdout.log
            out/m1-3b4b6b/fs-uae.stderr.log
            out/m1-3b4b6b/RUNTIME_PROVENANCE.txt
            out/m1-3b4b6b/aros-root/m68kdeb-6b-report.txt
            out/m1-3b4b6b/aros-root/m1-3b4b6b-linux-transfer-armed.marker
