name: M1.3b.4b.5d AROS guarded irreversible runtime

on:
  workflow_dispatch:
  push:
    paths:
      - 'loader/aros/m68kdeb-loader.c'
      - 'loader/aros/m68kdeb-layout.c'
      - 'loader/aros/m68kdeb-layout.h'
      - 'loader/aros/m68kdeb-handoff.c'
      - 'loader/aros/m68kdeb-handoff.h'
      - 'loader/aros/m68kdeb-takeover.c'
      - 'loader/aros/m68kdeb-takeover.h'
      - 'loader/aros/m68kdeb-takeover-68030.S'
      - 'loader/aros/m68kdeb-takeover-5d.c'
      - 'ci/fs-uae/fetch-aros-m68k-nightly.sh'
      - 'ci/fs-uae/prepare-m1_3b4b5d-runtime.sh'
      - 'ci/fs-uae/m1_3b4b5d_aros_a1200_irreversible.fs-uae'
      - '.github/workflows/m1_3b4b5d-aros-irreversible-runtime.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl fs-uae scrot unzip xvfb xorriso
          fs-uae --version
          docker --version

      - name: Build reversible loader and guarded 5d harness
        run: |
          mkdir -p out/m1-3b4b5d out/m68kdeb-loader
          docker pull amigadev/m68k-amigaos-gcc:latest
          docker run --rm -v "$PWD:/work" -w /work \
            amigadev/m68k-amigaos-gcc:latest sh -lc '
              set -eu
              CC=$(find / -type f -name "m68k-amigaos-gcc" 2>/dev/null | head -n 1)
              test -n "$CC" && test -x "$CC"
              echo "compiler_path=$CC" | tee /work/out/m1-3b4b5d/TOOLCHAIN.txt
              "$CC" --version | head -n 3 | tee -a /work/out/m1-3b4b5d/TOOLCHAIN.txt

              "$CC" \
                loader/aros/m68kdeb-loader.c \
                loader/aros/m68kdeb-layout.c \
                loader/aros/m68kdeb-handoff.c \
                loader/aros/m68kdeb-takeover.c \
                -o out/m68kdeb-loader/m68kdeb-loader \
                -m68000 -Os -Wall -Wextra -Werror \
                -Wno-error=pointer-sign -Wno-error=int-conversion \
                -noixemul

              "$CC" \
                loader/aros/m68kdeb-takeover-5d.c \
                loader/aros/m68kdeb-takeover.c \
                loader/aros/m68kdeb-takeover-68030.S \
                -o out/m1-3b4b5d/m68kdeb-takeover-5d \
                -m68030 -Os -Wall -Wextra -Werror \
                -Wno-error=pointer-sign -Wno-error=int-conversion \
                -noixemul
            '
          file out/m68kdeb-loader/m68kdeb-loader out/m1-3b4b5d/m68kdeb-takeover-5d
          sha256sum out/m68kdeb-loader/m68kdeb-loader \
                    out/m1-3b4b5d/m68kdeb-takeover-5d \
            | tee out/m1-3b4b5d/SHA256SUMS

      - name: Prove irreversible symbol isolation
        run: |
          if strings out/m68kdeb-loader/m68kdeb-loader | grep -q 'm68kdeb_takeover_68030_commit'; then
            echo 'irreversible commit path leaked into normal reversible loader' >&2
            exit 1
          fi
          strings out/m68kdeb-loader/m68kdeb-loader | grep -q 'handoff=NOT_ATTEMPTED'
          strings out/m1-3b4b5d/m68kdeb-takeover-5d | grep -q 'M68KDEB_5D_ARMED'
          docker run --rm -v "$PWD:/work" -w /work \
            amigadev/m68k-amigaos-gcc:latest sh -lc '
              set -eu
              NM=$(find /opt/amiga -type f -name "m68k-amigaos-nm" | head -n 1)
              OBJDUMP=$(find /opt/amiga -type f -name "m68k-amigaos-objdump" | head -n 1)
              test -x "$NM" && test -x "$OBJDUMP"
              if "$NM" out/m68kdeb-loader/m68kdeb-loader | grep -q "m68kdeb_takeover_68030_commit"; then
                echo "commit symbol linked into reversible loader" >&2
                exit 1
              fi
              "$NM" out/m1-3b4b5d/m68kdeb-takeover-5d | \
                grep -q " T m68kdeb_takeover_68030_commit$"
              "$OBJDUMP" -dr out/m1-3b4b5d/m68kdeb-takeover-5d \
                > out/m1-3b4b5d/m68kdeb-takeover-5d.disasm
              grep -q "m68kdeb_takeover_68030_commit_boundary" \
                out/m1-3b4b5d/m68kdeb-takeover-5d.disasm
              grep -q "m68kdeb_takeover_68030_cache_mmu_boundary" \
                out/m1-3b4b5d/m68kdeb-takeover-5d.disasm
            '

      - name: Prepare matching AROS runtime
        run: sh ci/fs-uae/prepare-m1_3b4b5d-runtime.sh

      - name: Run guarded irreversible boundary under FS-UAE
        run: |
          set +e
          xvfb-run -a sh -eu -c '
            fs-uae ci/fs-uae/m1_3b4b5d_aros_a1200_irreversible.fs-uae \
              >out/m1-3b4b5d/fs-uae.stdout.log 2>&1 &
            emu=$!
            startup=0
            armed=0
            returned=0
            for i in $(seq 1 240); do
              [ -f out/m1-3b4b5d/aros-root/m1-3b4b5d-startup.marker ] && startup=1
              if [ -f out/m1-3b4b5d/aros-root/m68kdeb-5d-report.txt ] && \
                 grep -q "takeover_preflight_rc=0" out/m1-3b4b5d/aros-root/m68kdeb-5d-report.txt && \
                 grep -q "M68KDEB_TAKEOVER_PREFLIGHT_OK" out/m1-3b4b5d/aros-root/m68kdeb-5d-report.txt && \
                 grep -q "M68KDEB_5D_ARMED" out/m1-3b4b5d/aros-root/m68kdeb-5d-report.txt; then
                armed=1
              fi
              [ -f out/m1-3b4b5d/aros-root/m1-3b4b5d-returned.marker ] && returned=1
              [ "$startup" -eq 1 ] && [ "$armed" -eq 1 ] && break
              if ! kill -0 "$emu" 2>/dev/null; then break; fi
              sleep 1
            done
            sleep 5
            [ -f out/m1-3b4b5d/aros-root/m1-3b4b5d-returned.marker ] && returned=1
            scrot out/m1-3b4b5d/screenshots/m1-3b4b5d-irreversible.png || true
            kill -INT "$emu" 2>/dev/null || true
            sleep 2
            kill -TERM "$emu" 2>/dev/null || true
            wait "$emu" 2>/dev/null || true
            printf "startup=%s\narmed=%s\nreturned=%s\n" "$startup" "$armed" "$returned" \
              >out/m1-3b4b5d/BOUNDARIES.txt
            [ "$startup" -eq 1 ] && [ "$armed" -eq 1 ] && [ "$returned" -eq 0 ]
          '
          rc=$?
          set -e

          cat out/m1-3b4b5d/aros-root/m68kdeb-5d-report.txt || true
          cat out/m1-3b4b5d/BOUNDARIES.txt || true
          if [ "$rc" -eq 0 ]; then
            echo 'classification=AROS_GUARDED_IRREVERSIBLE_68030_BOUNDARY_PASS' \
              >out/m1-3b4b5d/CLASSIFICATION.txt
          else
            echo 'classification=AROS_GUARDED_IRREVERSIBLE_68030_BOUNDARY_FAIL' \
              >out/m1-3b4b5d/CLASSIFICATION.txt
          fi
          cat out/m1-3b4b5d/CLASSIFICATION.txt
          tail -200 out/m1-3b4b5d/fs-uae.stdout.log || true
          exit "$rc"

      - name: Record qualification PASS
        run: |
          {
            echo 'result=PASS'
            echo "git=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo 'scope=guarded irreversible A1200 68030+MMU boundary only; no Linux entry transfer'
            cat out/m1-3b4b5d/TOOLCHAIN.txt
            cat out/m1-3b4b5d/CLASSIFICATION.txt
            cat out/m1-3b4b5d/BOUNDARIES.txt
            cat out/m1-3b4b5d/RUNTIME_PROVENANCE.txt
            cat out/m1-3b4b5d/SHA256SUMS
          } >out/m1-3b4b5d/RESULT.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-3b4b5d-aros-runtime-${{ github.sha }}
          path: |
            out/m1-3b4b5d/RESULT.txt
            out/m1-3b4b5d/BOUNDARIES.txt
            out/m1-3b4b5d/CLASSIFICATION.txt
            out/m1-3b4b5d/RUNTIME_PROVENANCE.txt
            out/m1-3b4b5d/TOOLCHAIN.txt
            out/m1-3b4b5d/SHA256SUMS
            out/m1-3b4b5d/m68kdeb-takeover-5d.disasm
            out/m1-3b4b5d/ORIGINAL-Startup-Sequence
            out/m1-3b4b5d/aros-fetch/SOURCE_URL
            out/m1-3b4b5d/aros-fetch/SHA256SUMS
            out/m1-3b4b5d/aros-fetch/ISO_SHA256
            out/m1-3b4b5d/aros-root/S/Startup-Sequence
            out/m1-3b4b5d/aros-root/m1-3b4b5d-*.marker
            out/m1-3b4b5d/aros-root/m68kdeb-5d-report.txt
            out/m1-3b4b5d/fs-uae.stdout.log
            out/m1-3b4b5d/logs/
            out/m1-3b4b5d/screenshots/
            out/m1-3b4b5d/rom/
          if-no-files-found: warn
          retention-days: 14
