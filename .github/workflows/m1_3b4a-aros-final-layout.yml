name: M1.3b.4a AROS final kernel layout

on:
  workflow_dispatch:
  push:
    paths:
      - 'loader/aros/m68kdeb-loader.c'
      - 'loader/aros/m68kdeb-layout-probe.c'
      - 'kernel/build-amiga.sh'
      - 'initramfs/build-amiga.sh'
      - 'ci/fs-uae/fetch-aros-m68k-nightly.sh'
      - 'ci/fs-uae/m1_3b4a_aros_a1200_final_layout.fs-uae'
      - 'ci/fs-uae/prepare-m1_3b4a-final-layout.sh'
      - '.github/workflows/m1_3b4a-aros-final-layout.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl file flex \
            fs-uae gcc-m68k-linux-gnu gzip libelf-dev libssl-dev make \
            scrot unzip xvfb xorriso xz-utils
          fs-uae --version
          docker --version

      - name: Build Linux 7.2 Amiga kernel
        run: sh kernel/build-amiga.sh

      - name: Build m68kDeb initramfs
        run: sh initramfs/build-amiga.sh

      - name: Probe and build AROS loader tools with Bebbo
        run: |
          mkdir -p out/m68kdeb-loader
          docker pull amigadev/m68k-amigaos-gcc:latest
          docker run --rm \
            -v "$PWD:/work" -w /work \
            amigadev/m68k-amigaos-gcc:latest \
            sh -lc '
              set -eu
              find / -type f \( -name "m68k-amigaos-gcc" -o -name "*amigaos*gcc" -o -name "m68k-*-gcc" \) 2>/dev/null | sort | tee /tmp/compiler-candidates.txt
              CC=$(awk "/\/m68k-amigaos-gcc$/ { print; exit }" /tmp/compiler-candidates.txt)
              if [ -z "$CC" ]; then CC=$(head -n 1 /tmp/compiler-candidates.txt || true); fi
              test -n "$CC" && test -x "$CC"
              echo "compiler_path=$CC" | tee /work/out/m68kdeb-loader/TOOLCHAIN.txt
              "$CC" --version | head -n 3 | tee -a /work/out/m68kdeb-loader/TOOLCHAIN.txt
              "$CC" loader/aros/m68kdeb-loader.c \
                -o out/m68kdeb-loader/m68kdeb-loader \
                -m68000 -Os -Wall -Wextra -noixemul
              "$CC" loader/aros/m68kdeb-layout-probe.c \
                -o out/m68kdeb-loader/m68kdeb-layout-probe \
                -m68000 -Os -Wall -Wextra -noixemul
            '
          file out/m68kdeb-loader/m68kdeb-loader out/m68kdeb-loader/m68kdeb-layout-probe
          sha256sum out/m68kdeb-loader/m68kdeb-loader \
                    out/m68kdeb-loader/m68kdeb-layout-probe \
            | tee out/m68kdeb-loader/SHA256SUMS

      - name: Prepare matching-AROS runtime
        run: sh ci/fs-uae/prepare-m1_3b4a-final-layout.sh

      - name: Run reversible final-layout qualification under FS-UAE
        run: |
          mkdir -p out/m1-3b4a/logs out/m1-3b4a/screenshots
          set +e
          xvfb-run -a sh -eu -c '
            fs-uae ci/fs-uae/m1_3b4a_aros_a1200_final_layout.fs-uae >out/m1-3b4a/fs-uae.stdout.log 2>&1 &
            emu=$!
            startup=0
            preflight=0
            layout_returned=0
            preflight_report=0
            layout_report=0
            for i in $(seq 1 240); do
              [ -f out/m1-3b4a/aros-root/m1-3b4a-startup.marker ] && startup=1
              [ -f out/m1-3b4a/aros-root/m1-3b4a-preflight-returned.marker ] && preflight=1
              [ -f out/m1-3b4a/aros-root/m1-3b4a-layout-returned.marker ] && layout_returned=1
              if [ -f out/m1-3b4a/aros-root/m68kdeb-bootinfo-report.txt ] && \
                 grep -q "M68KDEB_INITRAMFS_LOADED" out/m1-3b4a/aros-root/m68kdeb-bootinfo-report.txt && \
                 grep -q "kernel_amiga_bootinfo_version=0x00020000" out/m1-3b4a/aros-root/m68kdeb-bootinfo-report.txt && \
                 grep -q "M68KDEB_BOOTINFO_BUILD_OK" out/m1-3b4a/aros-root/m68kdeb-bootinfo-report.txt && \
                 grep -q "handoff=NOT_ATTEMPTED" out/m1-3b4a/aros-root/m68kdeb-bootinfo-report.txt; then
                preflight_report=1
              fi
              if [ -f out/m1-3b4a/aros-root/m68kdeb-layout-report.txt ] && \
                 grep -q "M68KDEB_LAYOUT_START" out/m1-3b4a/aros-root/m68kdeb-layout-report.txt && \
                 grep -q "kernel_format=ELF32-BE-m68k" out/m1-3b4a/aros-root/m68kdeb-layout-report.txt && \
                 grep -q "layout_base_page_aligned=1" out/m1-3b4a/aros-root/m68kdeb-layout-report.txt && \
                 grep -q "layout_bootinfo_immediate=1" out/m1-3b4a/aros-root/m68kdeb-layout-report.txt && \
                 grep -Eq "layout_image_bytes=[1-9][0-9]*" out/m1-3b4a/aros-root/m68kdeb-layout-report.txt && \
                 grep -q "M68KDEB_FINAL_LAYOUT_OK" out/m1-3b4a/aros-root/m68kdeb-layout-report.txt && \
                 grep -q "handoff=NOT_ATTEMPTED" out/m1-3b4a/aros-root/m68kdeb-layout-report.txt; then
                layout_report=1
              fi
              [ "$startup" -eq 1 ] && [ "$preflight" -eq 1 ] && \
              [ "$layout_returned" -eq 1 ] && [ "$preflight_report" -eq 1 ] && \
              [ "$layout_report" -eq 1 ] && break
              if ! kill -0 "$emu" 2>/dev/null; then break; fi
              sleep 1
            done
            scrot out/m1-3b4a/screenshots/m1-3b4a-final-layout.png || true
            kill -INT "$emu" 2>/dev/null || true
            sleep 2
            kill -TERM "$emu" 2>/dev/null || true
            wait "$emu" 2>/dev/null || true
            printf "startup=%s\npreflight_returned=%s\nlayout_returned=%s\npreflight_report_valid=%s\nlayout_report_valid=%s\n" \
              "$startup" "$preflight" "$layout_returned" "$preflight_report" "$layout_report" \
              >out/m1-3b4a/BOUNDARIES.txt
            if [ "$startup" -eq 1 ] && [ "$preflight" -eq 1 ] && \
               [ "$layout_returned" -eq 1 ] && [ "$preflight_report" -eq 1 ] && \
               [ "$layout_report" -eq 1 ]; then
              echo "classification=AROS_FINAL_KERNEL_LAYOUT_PASS" >out/m1-3b4a/CLASSIFICATION.txt
              exit 0
            fi
            echo "classification=AROS_FINAL_KERNEL_LAYOUT_FAIL" >out/m1-3b4a/CLASSIFICATION.txt
            exit 1
          '
          rc=$?
          set -e
          echo '=== BOUNDARIES ==='
          cat out/m1-3b4a/BOUNDARIES.txt || true
          echo '=== CLASSIFICATION ==='
          cat out/m1-3b4a/CLASSIFICATION.txt || true
          echo '=== PREFLIGHT REPORT ==='
          cat out/m1-3b4a/aros-root/m68kdeb-bootinfo-report.txt || true
          echo '=== LAYOUT REPORT ==='
          cat out/m1-3b4a/aros-root/m68kdeb-layout-report.txt || true
          echo '=== FS-UAE TAIL ==='
          tail -200 out/m1-3b4a/fs-uae.stdout.log || true
          exit "$rc"

      - name: Record qualification PASS
        run: |
          {
            echo 'result=PASS'
            echo "git=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo 'scope=Linux PT_LOAD image materialized into page-aligned contiguous memory with bootinfo immediately after kernel; no privileged takeover or handoff'
            cat out/m68kdeb-loader/TOOLCHAIN.txt
            cat out/m1-3b4a/CLASSIFICATION.txt
            cat out/m1-3b4a/BOUNDARIES.txt
            cat out/m1-3b4a/RUNTIME_PROVENANCE.txt
            cat out/m68kdeb-loader/SHA256SUMS
            sha256sum out/kernel-amiga/vmlinux-m68k-amiga
            sha256sum out/initramfs-amiga/initramfs-m68kdeb.gz
            fs-uae --version | head -n 1 | sed 's/^/fs_uae=/'
          } >out/m1-3b4a/RESULT.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-3b4a-aros-final-layout-${{ github.sha }}
          path: |
            out/m1-3b4a/RESULT.txt
            out/m1-3b4a/BOUNDARIES.txt
            out/m1-3b4a/CLASSIFICATION.txt
            out/m1-3b4a/RUNTIME_PROVENANCE.txt
            out/m1-3b4a/ORIGINAL-Startup-Sequence
            out/m1-3b4a/aros-fetch/SOURCE_URL
            out/m1-3b4a/aros-fetch/SHA256SUMS
            out/m1-3b4a/aros-fetch/ISO_SHA256
            out/m1-3b4a/aros-root/S/Startup-Sequence
            out/m1-3b4a/aros-root/m1-3b4a-*.marker
            out/m1-3b4a/aros-root/m68kdeb-bootinfo-report.txt
            out/m1-3b4a/aros-root/m68kdeb-layout-report.txt
            out/m1-3b4a/fs-uae.stdout.log
            out/m1-3b4a/logs/
            out/m1-3b4a/screenshots/
            out/m1-3b4a/rom/
            out/m68kdeb-loader/TOOLCHAIN.txt
            out/m68kdeb-loader/SHA256SUMS
            out/kernel-amiga/VERSION
            out/kernel-amiga/SOURCE_URL
            out/kernel-amiga/linux-source.SHA256
            out/initramfs-amiga/SHA256SUMS
            out/initramfs-amiga/busybox-static.SHA256
            out/initramfs-amiga/BUSYBOX_SOURCE_URL
          if-no-files-found: warn
          retention-days: 14
