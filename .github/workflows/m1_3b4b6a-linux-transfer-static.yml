name: M1.3b.4b.6a Linux transfer static qualification

on:
  workflow_dispatch:
  push:
    paths:
      - 'loader/aros/m68kdeb-takeover-68030-linux-trampoline.S'
      - 'docs/M1_3B4B6A_LINUX_TRANSFER_STATIC.md'
      - '.github/workflows/m1_3b4b6a-linux-transfer-static.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux transfer trampoline
        run: |
          mkdir -p out/m1-3b4b6a
          docker pull amigadev/m68k-amigaos-gcc:latest
          docker run --rm -v "$PWD:/work" -w /work amigadev/m68k-amigaos-gcc:latest sh -lc '
            set -eu
            CC=$(find / -type f -name "m68k-amigaos-gcc" 2>/dev/null | head -n 1)
            NM=$(find / -type f -name "m68k-amigaos-nm" 2>/dev/null | head -n 1)
            OBJCOPY=$(find / -type f -name "m68k-amigaos-objcopy" 2>/dev/null | head -n 1)
            OBJDUMP=$(find / -type f -name "m68k-amigaos-objdump" 2>/dev/null | head -n 1)
            "$CC" -x assembler-with-cpp -c loader/aros/m68kdeb-takeover-68030-linux-trampoline.S \
              -o out/m1-3b4b6a/linux-trampoline.o -m68030 -m68851
            "$NM" -n out/m1-3b4b6a/linux-trampoline.o > out/m1-3b4b6a/linux-trampoline.nm
            "$OBJDUMP" -r out/m1-3b4b6a/linux-trampoline.o > out/m1-3b4b6a/linux-trampoline.relocs.txt
            "$OBJDUMP" -d out/m1-3b4b6a/linux-trampoline.o > out/m1-3b4b6a/linux-trampoline.disasm.txt
            "$OBJCOPY" -O binary -j .text out/m1-3b4b6a/linux-trampoline.o out/m1-3b4b6a/linux-trampoline.bin
          '

      - name: Enforce exact irreversible transfer contract
        run: |
          ! grep -Eq '^[[:space:]]*[0-9a-fA-F]+[[:space:]]+R_' out/m1-3b4b6a/linux-trampoline.relocs.txt
          grep -Eqi 'movec.*cacr|cacr.*movec' out/m1-3b4b6a/linux-trampoline.disasm.txt
          grep -Eqi 'pmove.*tc|tc.*pmove' out/m1-3b4b6a/linux-trampoline.disasm.txt
          grep -Eqi 'pflusha' out/m1-3b4b6a/linux-trampoline.disasm.txt
          grep -Eqi 'jmp.*\(?%?a1\)?' out/m1-3b4b6a/linux-trampoline.disasm.txt
          if grep -Eqi '[[:space:]](jsr|rts|rte|rtr)([[:space:]]|$)' out/m1-3b4b6a/linux-trampoline.disasm.txt; then
            echo 'unexpected return/call instruction in Linux transfer trampoline' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          names = {
              'entry': 'm68kdeb_takeover_68030_linux_entry',
              'mmu_off': 'm68kdeb_takeover_68030_linux_mmu_off',
              'post_mmu': 'm68kdeb_takeover_68030_linux_post_mmu',
              'jump': 'm68kdeb_takeover_68030_linux_jump',
              'tc_zero': 'm68kdeb_takeover_68030_linux_tc_zero',
              'end': 'm68kdeb_takeover_68030_linux_end',
          }
          syms = {}
          for line in Path('out/m1-3b4b6a/linux-trampoline.nm').read_text().splitlines():
              p = line.split()
              if len(p) >= 3:
                  for key, name in names.items():
                      if p[2] == name:
                          syms[key] = int(p[0], 16)
          assert set(syms) == set(names), syms
          assert syms['entry'] == 0
          assert syms['entry'] < syms['mmu_off'] < syms['post_mmu'] < syms['jump'] < syms['tc_zero'] < syms['end']
          data = Path('out/m1-3b4b6a/linux-trampoline.bin').read_bytes()
          assert 0 < len(data) <= 4096
          assert syms['end'] <= len(data)
          assert data[syms['tc_zero']:syms['tc_zero']+4] == b'\x00\x00\x00\x00'
          Path('out/m1-3b4b6a/CONTRACT.txt').write_text(
              'linux_jump=STATIC_ONLY\n' +
              f'blob_bytes={len(data)}\n' +
              ''.join(f'{k}_offset={v}\n' for k,v in syms.items()))
          PY
          sha256sum out/m1-3b4b6a/linux-trampoline.bin > out/m1-3b4b6a/SHA256SUMS

      - name: Record PASS
        run: |
          cat out/m1-3b4b6a/CONTRACT.txt
          echo 'M1.3b.4b.6a PASS: relocation-free CACR=0 -> TC=0 -> PFLUSHA -> JMP(a1); runtime Linux transfer not attempted.'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-3b4b6a-linux-transfer-static
          path: out/m1-3b4b6a/
