name: M1.3b.4b.5y actual payload precommit readiness

on:
  workflow_dispatch:
  push:
    paths:
      - 'loader/aros/m68kdeb-loader.c'
      - 'loader/aros/m68kdeb-loader-68030-precommit-qual.c'
      - 'loader/aros/m68kdeb-layout.c'
      - 'loader/aros/m68kdeb-layout.h'
      - 'loader/aros/m68kdeb-handoff.c'
      - 'loader/aros/m68kdeb-handoff.h'
      - 'loader/aros/m68kdeb-takeover.c'
      - 'loader/aros/m68kdeb-takeover.h'
      - 'loader/aros/m68kdeb-takeover-68030-trampoline.S'
      - 'loader/aros/m68kdeb-68030-transition-abi-call.S'
      - 'loader/aros/m68kdeb-68030-takeover-identity.c'
      - 'loader/aros/m68kdeb-68030-takeover-identity.h'
      - 'loader/aros/m68kdeb-68030-identity-window.c'
      - 'loader/aros/m68kdeb-68030-identity-window.h'
      - 'loader/aros/m68kdeb-68030-mmu-state.S'
      - 'loader/aros/m68kdeb-68030-mmu-state.h'
      - 'loader/aros/m68kdeb-physwin.c'
      - 'loader/aros/m68kdeb-physwin.h'
      - 'kernel/**'
      - 'initramfs/**'
      - 'ci/fs-uae/fetch-aros-m68k-nightly.sh'
      - 'ci/fs-uae/prepare-m1_3b4b5y-precommit-ready.sh'
      - 'ci/fs-uae/m1_3b4b5y_aros_a1200_precommit_ready.fs-uae'
      - '.github/workflows/m1_3b4b5y-precommit-ready.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl file flex \
            fs-uae gcc-m68k-linux-gnu gzip libelf-dev libssl-dev make python3 \
            scrot unzip xvfb xorriso xz-utils lhasa
          fs-uae --version
          docker --version

      - name: Build qualified Amiga kernel and initramfs
        run: |
          sh kernel/build-amiga.sh
          sh initramfs/build-amiga.sh
          test -s out/kernel-amiga/vmlinux-m68k-amiga
          test -s out/initramfs-amiga/initramfs-m68kdeb.gz

      - name: Build and bind exact transition trampoline layout
        run: |
          mkdir -p out/m1-3b4b5y
          docker pull amigadev/m68k-amigaos-gcc:latest
          docker run --rm -v "$PWD:/work" -w /work amigadev/m68k-amigaos-gcc:latest sh -lc '
            set -eu
            CC=$(find / -type f -name "m68k-amigaos-gcc" 2>/dev/null | head -n 1)
            NM=$(find / -type f -name "m68k-amigaos-nm" 2>/dev/null | head -n 1)
            OBJCOPY=$(find / -type f -name "m68k-amigaos-objcopy" 2>/dev/null | head -n 1)
            OBJDUMP=$(find / -type f -name "m68k-amigaos-objdump" 2>/dev/null | head -n 1)
            test -x "$CC" && test -x "$NM" && test -x "$OBJCOPY" && test -x "$OBJDUMP"
            "$CC" -x assembler-with-cpp -c loader/aros/m68kdeb-takeover-68030-trampoline.S \
              -o out/m1-3b4b5y/trampoline.o -m68030 -m68851
            "$NM" -n out/m1-3b4b5y/trampoline.o > out/m1-3b4b5y/trampoline.nm
            "$OBJDUMP" -r out/m1-3b4b5y/trampoline.o > out/m1-3b4b5y/trampoline.relocs.txt
            "$OBJDUMP" -d out/m1-3b4b5y/trampoline.o > out/m1-3b4b5y/trampoline.disasm.txt
            "$OBJCOPY" -O binary -j .text out/m1-3b4b5y/trampoline.o out/m1-3b4b5y/trampoline.bin
          '
          ! grep -Eq '^[[:space:]]*[0-9a-fA-F]+[[:space:]]+R_' out/m1-3b4b5y/trampoline.relocs.txt
          python3 - <<'PY'
          from pathlib import Path
          names = {
              'entry': 'm68kdeb_takeover_68030_trampoline_entry',
              'mmu_off': 'm68kdeb_takeover_68030_trampoline_mmu_off',
              'post_mmu': 'm68kdeb_takeover_68030_trampoline_post_mmu',
              'tc_zero': 'm68kdeb_takeover_68030_trampoline_tc_zero',
              'abi': 'm68kdeb_takeover_68030_trampoline_abi_probe',
              'rev': 'm68kdeb_takeover_68030_trampoline_reversible_probe',
              'end': 'm68kdeb_takeover_68030_trampoline_end',
          }
          syms = {}
          for line in Path('out/m1-3b4b5y/trampoline.nm').read_text().splitlines():
              p = line.split()
              if len(p) >= 3:
                  for key, name in names.items():
                      if p[2] == name:
                          syms[key] = int(p[0], 16)
          assert set(syms) == set(names), syms
          data = Path('out/m1-3b4b5y/trampoline.bin').read_bytes()
          assert 0 < len(data) <= 4096
          assert syms['entry'] == 0
          assert syms['entry'] < syms['mmu_off'] < syms['post_mmu'] < syms['tc_zero']
          assert syms['tc_zero'] + 4 <= syms['abi'] < syms['rev'] < syms['end'] <= len(data)
          assert data[syms['tc_zero']:syms['tc_zero']+4] == b'\x00\x00\x00\x00'
          assert data[syms['rev']:syms['end']] == bytes.fromhex('70004e75')
          body = ','.join(f'0x{x:02x}' for x in data)
          fields = ''.join(
              f'unsigned int m68kdeb_trampoline_{key}_offset={value};\n'
              for key, value in syms.items())
          Path('out/m1-3b4b5y/trampoline-blob.c').write_text(
              'unsigned char m68kdeb_trampoline_blob[]={' + body + '};\n'
              'unsigned int m68kdeb_trampoline_blob_len=sizeof(m68kdeb_trampoline_blob);\n' + fields)
          Path('out/m1-3b4b5y/LAYOUT.txt').write_text(
              f"blob_bytes={len(data)}\n" + ''.join(f"{k}_offset={v}\n" for k,v in syms.items()))
          Path('out/m1-3b4b5y/ABI_RANGE.env').write_text(
              f"ABI_START={syms['abi']}\nABI_END={syms['rev']}\n")
          PY
          docker run --rm -v "$PWD:/work" -w /work amigadev/m68k-amigaos-gcc:latest sh -lc '
            set -eu
            . out/m1-3b4b5y/ABI_RANGE.env
            OBJDUMP=$(find / -type f -name "m68k-amigaos-objdump" 2>/dev/null | head -n 1)
            "$OBJDUMP" -d --start-address="$ABI_START" --stop-address="$ABI_END" \
              out/m1-3b4b5y/trampoline.o > out/m1-3b4b5y/abi-probe.disasm.txt
          '
          ! grep -Eiq '\b(movec|pmove|pflusha|jmp|bra|bsr)\b|ori.*%sr' out/m1-3b4b5y/abi-probe.disasm.txt
          grep -Eiq '\brts\b' out/m1-3b4b5y/abi-probe.disasm.txt

      - name: Build actual-payload precommit qualifier
        run: |
          docker run --rm -v "$PWD:/work" -w /work amigadev/m68k-amigaos-gcc:latest sh -lc '
            set -eu
            CC=$(find / -type f -name "m68k-amigaos-gcc" 2>/dev/null | head -n 1)
            NM=$(find / -type f -name "m68k-amigaos-nm" 2>/dev/null | head -n 1)
            "$CC" \
              loader/aros/m68kdeb-loader-68030-precommit-qual.c \
              loader/aros/m68kdeb-layout.c loader/aros/m68kdeb-handoff.c \
              loader/aros/m68kdeb-takeover.c \
              loader/aros/m68kdeb-68030-takeover-identity.c \
              loader/aros/m68kdeb-68030-identity-window.c \
              loader/aros/m68kdeb-physwin.c loader/aros/m68kdeb-68030-mmu-state.S \
              loader/aros/m68kdeb-68030-transition-abi-call.S \
              out/m1-3b4b5y/trampoline-blob.c \
              -o out/m1-3b4b5y/m68kdeb-loader-68030-precommit-qual \
              -m68030 -Os -Wall -Wextra -Werror \
              -Wno-error=pointer-sign -Wno-error=int-conversion -noixemul
            "$NM" out/m1-3b4b5y/m68kdeb-loader-68030-precommit-qual > out/m1-3b4b5y/loader.nm
          '
          strings out/m1-3b4b5y/m68kdeb-loader-68030-precommit-qual | grep -q 'M68KDEB_5Y_PRECOMMIT_READY'
          ! grep -Eq '[[:space:]][Tt][[:space:]]_?m68kdeb_takeover_68030_commit$' out/m1-3b4b5y/loader.nm

      - name: Enforce irreversible boundary exclusion
        run: |
          ! grep -q 'm68kdeb_takeover_68030_commit(' loader/aros/m68kdeb-loader-68030-precommit-qual.c
          grep -q 'm68kdeb_68030_call_transition_abi_probe' loader/aros/m68kdeb-loader-68030-precommit-qual.c
          grep -q 'transition_entry_execute=NOT_ATTEMPTED' loader/aros/m68kdeb-loader-68030-precommit-qual.c
          grep -q 'commit_execute=NOT_ATTEMPTED' loader/aros/m68kdeb-loader-68030-precommit-qual.c
          grep -q 'mmu_mutation=NOT_ATTEMPTED' loader/aros/m68kdeb-loader-68030-precommit-qual.c
          grep -q 'cache_mutation=NOT_ATTEMPTED' loader/aros/m68kdeb-loader-68030-precommit-qual.c
          grep -q 'pflusha=NOT_ATTEMPTED' loader/aros/m68kdeb-loader-68030-precommit-qual.c
          grep -q 'linux_jump=NOT_ATTEMPTED' loader/aros/m68kdeb-loader-68030-precommit-qual.c

      - name: Prepare matching AROS runtime
        run: sh ci/fs-uae/prepare-m1_3b4b5y-precommit-ready.sh

      - name: Qualify reversible precommit readiness under FS-UAE
        run: |
          set +e
          xvfb-run -a sh -eu -c '
            fs-uae ci/fs-uae/m1_3b4b5y_aros_a1200_precommit_ready.fs-uae >out/m1-3b4b5y/fs-uae.stdout.log 2>&1 &
            emu=$!
            startup=0; returned=0; ready=0
            for i in $(seq 1 240); do
              [ -f out/m1-3b4b5y/aros-root/m1-3b4b5y-startup.marker ] && startup=1
              [ -f out/m1-3b4b5y/aros-root/m1-3b4b5y-returned.marker ] && returned=1
              REPORT=out/m1-3b4b5y/aros-root/m68kdeb-5y-report.txt
              if [ -f "$REPORT" ] && \
                 grep -q "precommit_tc_rc=0" "$REPORT" && \
                 grep -q "precommit_tc=0x00000000" "$REPORT" && \
                 grep -q "actual_payload_identity_rc=0" "$REPORT" && \
                 grep -q "trampoline_identity_rc=0" "$REPORT" && \
                 grep -q "M68KDEB_5Y_TRANSITION_LAYOUT_BOUND" "$REPORT" && \
                 grep -q "actual_payload_abi_rc=0" "$REPORT" && \
                 grep -q "M68KDEB_5Y_PRECOMMIT_READY" "$REPORT" && \
                 grep -q "transition_entry_execute=NOT_ATTEMPTED" "$REPORT" && \
                 grep -q "commit_execute=NOT_ATTEMPTED" "$REPORT" && \
                 grep -q "mmu_mutation=NOT_ATTEMPTED" "$REPORT" && \
                 grep -q "cache_mutation=NOT_ATTEMPTED" "$REPORT" && \
                 grep -q "pflusha=NOT_ATTEMPTED" "$REPORT" && \
                 grep -q "linux_jump=NOT_ATTEMPTED" "$REPORT" && \
                 grep -q "M68KDEB_5Y_RETURNED" "$REPORT"; then ready=1; fi
              [ "$startup" -eq 1 ] && [ "$returned" -eq 1 ] && [ "$ready" -eq 1 ] && break
              if ! kill -0 "$emu" 2>/dev/null; then break; fi
              sleep 1
            done
            scrot out/m1-3b4b5y/screenshots/m1-3b4b5y-precommit-ready.png || true
            kill -INT "$emu" 2>/dev/null || true
            sleep 2
            kill -TERM "$emu" 2>/dev/null || true
            wait "$emu" 2>/dev/null || true
            printf "startup=%s\nreturned=%s\nprecommit_ready=%s\n" "$startup" "$returned" "$ready" >out/m1-3b4b5y/BOUNDARIES.txt
            [ "$startup" -eq 1 ] && [ "$returned" -eq 1 ] && [ "$ready" -eq 1 ]
          '
          rc=$?
          set -e
          cat out/m1-3b4b5y/aros-root/m68kdeb-5y-report.txt || true
          cat out/m1-3b4b5y/BOUNDARIES.txt || true
          exit "$rc"

      - name: Verify exact identity and ABI equality
        run: |
          python3 - <<'PY'
          from pathlib import Path
          vals = {}
          for line in Path('out/m1-3b4b5y/aros-root/m68kdeb-5y-report.txt').read_text().splitlines():
              if '=' in line:
                  k, v = line.split('=', 1)
                  vals[k] = v
          for a,b in (
              ('actual_req_ptr','captured_a0'),
              ('actual_req_entry','captured_a1'),
              ('actual_req_bootinfo','captured_a2'),
              ('actual_req_initramfs','captured_a3'),
              ('actual_layout_logical','actual_layout_physical'),
              ('actual_entry_logical','actual_entry_physical'),
              ('actual_bootinfo_logical','actual_bootinfo_physical'),
              ('actual_initramfs_logical','actual_initramfs_physical'),
              ('transition_entry_logical','transition_entry_physical')):
              assert vals[a] == vals[b], (a, vals.get(a), b, vals.get(b))
          PY

      - name: Record PASS
        run: |
          {
            echo 'result=PASS'
            echo "git=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo 'classification=M1_3B4B5Y_REVERSIBLE_PRECOMMIT_READY'
            cat out/m1-3b4b5y/LAYOUT.txt
            cat out/m1-3b4b5y/BOUNDARIES.txt
            cat out/m1-3b4b5y/RUNTIME_PROVENANCE.txt
          } >out/m1-3b4b5y/RESULT.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-3b4b5y-precommit-ready-${{ github.sha }}
          path: |
            out/m1-3b4b5y/RESULT.txt
            out/m1-3b4b5y/BOUNDARIES.txt
            out/m1-3b4b5y/LAYOUT.txt
            out/m1-3b4b5y/RUNTIME_PROVENANCE.txt
            out/m1-3b4b5y/trampoline.nm
            out/m1-3b4b5y/trampoline.relocs.txt
            out/m1-3b4b5y/trampoline.disasm.txt
            out/m1-3b4b5y/abi-probe.disasm.txt
            out/m1-3b4b5y/loader.nm
            out/m1-3b4b5y/aros-root/m68kdeb-5y-report.txt
            out/m1-3b4b5y/fs-uae.stdout.log
            out/m1-3b4b5y/screenshots/
          if-no-files-found: warn
          retention-days: 14
