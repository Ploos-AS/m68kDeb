name: M1.3a.16 AROS A3000 68030 woody handoff

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/m1_3a16-aros-a3000-68030-woody.yml'
      - 'ci/fs-uae/m1_3a16_aros_a3000_68030_woody_no_debug.fs-uae'
      - 'ci/fs-uae/prepare-m1_3a16-a3000-woody.sh'
      - 'platforms/amiga/fetch-amiboot.sh'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl fs-uae scrot socat unzip xvfb xorriso
          fs-uae --version

      - name: Fetch pinned amiboot and woody kernel
        run: |
          sh platforms/amiga/fetch-amiboot.sh
          mkdir -p out/m68kdeb-amiga
          cp out/amiboot/amiboot out/m68kdeb-amiga/amiboot
          curl -fL --retry 3 --retry-delay 2 \
            'https://archive.debian.org/debian/dists/woody/main/disks-m68k/current/amiga/linux.bin' \
            -o out/m68kdeb-amiga/woody-linux.bin
          echo '467861e153f2e879aff72aae78d3c8e05180d06e36e4d4f73b6cdb84af45bcb4  out/m68kdeb-amiga/woody-linux.bin' | sha256sum -c -

      - name: Prepare A3000 control
        run: sh ci/fs-uae/prepare-m1_3a16-a3000-woody.sh

      - name: Boot and classify A3000 handoff
        run: |
          rm -f /tmp/m68kdeb-fsuae-serial /tmp/m68kdeb-capture-serial
          socat -d -d pty,raw,echo=0,link=/tmp/m68kdeb-fsuae-serial pty,raw,echo=0,link=/tmp/m68kdeb-capture-serial 2>out/m1-3a16/socat.log &
          bridge=$!
          for i in $(seq 1 20); do [ -e /tmp/m68kdeb-fsuae-serial ] && [ -e /tmp/m68kdeb-capture-serial ] && break; sleep 1; done
          timeout 420 cat /tmp/m68kdeb-capture-serial >out/m1-3a16/serial.log & serial=$!
          set +e
          xvfb-run -a sh -eu -c '
            fs-uae ci/fs-uae/m1_3a16_aros_a3000_68030_woody_no_debug.fs-uae >out/m1-3a16/fs-uae.stdout.log 2>&1 & emu=$!
            startup=0; pre_handoff=0; returned=0; linux=0; emulator_exited=0
            for i in $(seq 1 420); do
              [ -f out/m1-3a16/aros-root/m1-3a16-startup.marker ] && startup=1
              [ -f out/m1-3a16/aros-root/m1-3a16-pre-handoff.marker ] && pre_handoff=1
              [ -f out/m1-3a16/aros-root/m1-3a16-amiboot-returned.marker ] && returned=1
              if grep -Eiq "Linux version|Calibrating delay loop|Memory:|Kernel panic|VFS:|Unable to mount root" out/m1-3a16/serial.log 2>/dev/null; then linux=1; break; fi
              [ "$returned" -eq 1 ] && break
              if ! kill -0 "$emu" 2>/dev/null; then emulator_exited=1; break; fi
              sleep 1
            done
            scrot out/m1-3a16/screenshots/m1-3a16.png || true
            kill -INT "$emu" 2>/dev/null || true; sleep 2; kill -TERM "$emu" 2>/dev/null || true; wait "$emu" 2>/dev/null || true
            printf "startup=%s\npre_handoff=%s\namiboot_returned=%s\nlinux=%s\nemulator_exited=%s\n" "$startup" "$pre_handoff" "$returned" "$linux" "$emulator_exited" >out/m1-3a16/BOUNDARIES.txt
            if [ "$startup" -ne 1 ]; then c=A3000_AROS_STARTUP_FAILURE; rc=1
            elif [ "$pre_handoff" -ne 1 ]; then c=A3000_PRE_HANDOFF_FAILURE; rc=1
            elif [ "$linux" -eq 1 ]; then c=A3000_HISTORICAL_LINUX_EXECUTION_OBSERVED; rc=0
            elif [ "$returned" -eq 1 ]; then c=A3000_AMIBOOT_RETURNED_WITHOUT_LINUX; rc=1
            elif [ "$emulator_exited" -eq 1 ]; then c=A3000_EMULATOR_EXIT_DURING_HANDOFF; rc=1
            else c=A3000_HANDOFF_STALL_NO_RETURN_NO_LINUX; rc=1; fi
            echo "classification=$c" >out/m1-3a16/CLASSIFICATION.txt
            exit "$rc"
          '
          rc=$?; set -e
          kill -TERM "$serial" "$bridge" 2>/dev/null || true
          wait "$serial" 2>/dev/null || true; wait "$bridge" 2>/dev/null || true
          echo '=== BOUNDARIES ==='; cat out/m1-3a16/BOUNDARIES.txt || true
          echo '=== CLASSIFICATION ==='; cat out/m1-3a16/CLASSIFICATION.txt || true
          echo '=== SERIAL TAIL ==='; tail -300 out/m1-3a16/serial.log || true
          echo '=== FS-UAE TAIL ==='; tail -300 out/m1-3a16/fs-uae.stdout.log || true
          exit "$rc"

      - name: Record PASS
        run: |
          {
            echo result=PASS
            echo git=${GITHUB_SHA}
            echo workflow_run=${GITHUB_RUN_ID}
            cat out/m1-3a16/CLASSIFICATION.txt
            cat out/m1-3a16/BOUNDARIES.txt
            cat out/m1-3a16/RUNTIME_PROVENANCE.txt
          } >out/m1-3a16/RESULT.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-3a16-a3000-woody-${{ github.sha }}
          path: |
            out/m1-3a16/RESULT.txt
            out/m1-3a16/BOUNDARIES.txt
            out/m1-3a16/CLASSIFICATION.txt
            out/m1-3a16/RUNTIME_PROVENANCE.txt
            out/m1-3a16/ORIGINAL-Startup-Sequence
            out/m1-3a16/aros-root/S/Startup-Sequence
            out/m1-3a16/aros-root/m1-3a16-*.marker
            out/m1-3a16/serial.log
            out/m1-3a16/socat.log
            out/m1-3a16/fs-uae.stdout.log
            out/m1-3a16/rom/
            out/m1-3a16/screenshots/
          if-no-files-found: warn
          retention-days: 14
