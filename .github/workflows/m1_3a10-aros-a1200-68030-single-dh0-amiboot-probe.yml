name: M1.3a.10 AROS A1200 68030 single-DH0 amiboot probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/m1_3a10-aros-a1200-68030-single-dh0-amiboot-probe.yml'
      - 'ci/fs-uae/m1_3a10_aros_a1200_68030_single_dh0_amiboot_probe.fs-uae'
      - 'ci/fs-uae/prepare-m1_3a10-amiboot-probe.sh'
      - 'platforms/amiga/fetch-amiboot.sh'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl fs-uae scrot socat unzip xvfb xorriso
          fs-uae --version

      - name: Fetch pinned amiboot only
        run: |
          sh platforms/amiga/fetch-amiboot.sh
          mkdir -p out/m68kdeb-amiga
          cp out/amiboot/amiboot out/m68kdeb-amiga/amiboot
          sha256sum out/m68kdeb-amiga/amiboot

      - name: Prepare known-good single-DH0 AROS topology plus amiboot
        run: sh ci/fs-uae/prepare-m1_3a10-amiboot-probe.sh

      - name: Boot AROS and probe amiboot executable boundary
        run: |
          mkdir -p out/m1-3a10/logs out/m1-3a10/screenshots
          rm -f /tmp/m68kdeb-fsuae-serial /tmp/m68kdeb-capture-serial

          socat -d -d \
            pty,raw,echo=0,link=/tmp/m68kdeb-fsuae-serial \
            pty,raw,echo=0,link=/tmp/m68kdeb-capture-serial \
            2>out/m1-3a10/socat.log &
          bridge=$!

          for i in $(seq 1 20); do
            [ -e /tmp/m68kdeb-fsuae-serial ] && [ -e /tmp/m68kdeb-capture-serial ] && break
            sleep 1
          done
          [ -e /tmp/m68kdeb-fsuae-serial ] && [ -e /tmp/m68kdeb-capture-serial ] || exit 1

          timeout 300 cat /tmp/m68kdeb-capture-serial >out/m1-3a10/serial.log &
          serial=$!

          xvfb-run -a sh -eu -c '
            fs-uae ci/fs-uae/m1_3a10_aros_a1200_68030_single_dh0_amiboot_probe.fs-uae >out/m1-3a10/fs-uae.stdout.log 2>&1 &
            emu=$!
            startup=0
            invoking=0
            returned=0
            for i in $(seq 1 300); do
              [ -f out/m1-3a10/aros-root/m1-3a10-startup.marker ] && startup=1
              [ -f out/m1-3a10/aros-root/m1-3a10-invoking-amiboot.marker ] && invoking=1
              if [ -f out/m1-3a10/aros-root/m1-3a10-after-amiboot.marker ]; then
                returned=1
                break
              fi
              if ! kill -0 "$emu" 2>/dev/null; then
                echo "FS-UAE exited before amiboot probe completed" >&2
                break
              fi
              sleep 1
            done
            scrot out/m1-3a10/screenshots/m1-3a10-amiboot-probe.png || true
            kill -INT "$emu" 2>/dev/null || true
            sleep 2
            kill -TERM "$emu" 2>/dev/null || true
            wait "$emu" 2>/dev/null || true
            printf "startup=%s\ninvoking=%s\nreturned=%s\n" "$startup" "$invoking" "$returned" > out/m1-3a10/BOUNDARIES.txt
            if [ "$startup" -ne 1 ]; then
              echo "M1.3a.10 FAIL boundary: AROS did not reach Startup-Sequence" >&2
              cat out/m1-3a10/serial.log >&2 || true
              tail -200 out/m1-3a10/fs-uae.stdout.log >&2 || true
              exit 1
            fi
            if [ "$invoking" -ne 1 ]; then
              echo "M1.3a.10 FAIL boundary: Startup reached but amiboot invocation marker absent" >&2
              exit 1
            fi
            if [ "$returned" -ne 1 ]; then
              echo "M1.3a.10 FAIL boundary: amiboot invocation began but did not return" >&2
              cat out/m1-3a10/serial.log >&2 || true
              exit 1
            fi
          '
          rc=$?
          kill -TERM "$serial" 2>/dev/null || true
          kill -TERM "$bridge" 2>/dev/null || true
          wait "$serial" 2>/dev/null || true
          wait "$bridge" 2>/dev/null || true
          exit "$rc"

      - name: Record probe PASS
        run: |
          {
            echo "result=PASS"
            echo "git=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "machine=A1200"
            echo "cpu=68030"
            echo "mmu=68030"
            echo "cpu_speed=real"
            echo "hard_drive_count=1"
            echo "payload_on_dh0=amiboot-only"
            echo "linux_kernel=absent"
            echo "initramfs=absent"
            echo "startup_marker=observed"
            echo "amiboot_invocation_marker=observed"
            echo "amiboot_return_marker=observed"
            sha256sum out/m1-3a10/aros-root/amiboot
            fs-uae --version | head -n 1 | sed 's/^/fs_uae=/'
          } > out/m1-3a10/RESULT.txt

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-3a10-aros-a1200-68030-single-dh0-amiboot-${{ github.sha }}
          path: |
            out/m1-3a10/RESULT.txt
            out/m1-3a10/BOUNDARIES.txt
            out/m1-3a10/RUNTIME_PROVENANCE.txt
            out/m1-3a10/ORIGINAL-Startup-Sequence
            out/m1-3a10/aros-root/S/Startup-Sequence
            out/m1-3a10/aros-root/m1-3a10-*.marker
            out/m1-3a10/serial.log
            out/m1-3a10/socat.log
            out/m1-3a10/fs-uae.stdout.log
            out/m1-3a10/rom/
            out/m1-3a10/screenshots/
            out/amiboot/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
