name: M1.1 rootfs qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1_1-rootfs-qualification.yml'
      - 'Makefile'
      - 'scripts/check-current-ports.sh'
      - 'rootfs/build-current.sh'
      - 'releases/current.yaml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Qualify in privileged Debian unstable container
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:unstable sh -euxc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                arch-test ca-certificates curl gzip git make mmdebstrap qemu-user \
                qemu-user-binfmt debian-ports-archive-keyring xz-utils
              mkdir -p /proc/sys/fs/binfmt_misc
              mountpoint -q /proc/sys/fs/binfmt_misc || mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
              test -x /usr/bin/qemu-m68k
              test -f /usr/share/qemu/binfmt.d/qemu-m68k.conf
              if [ -e /proc/sys/fs/binfmt_misc/qemu-m68k ]; then
                echo -1 > /proc/sys/fs/binfmt_misc/qemu-m68k
              fi
              cat /usr/share/qemu/binfmt.d/qemu-m68k.conf > /proc/sys/fs/binfmt_misc/register
              cat /proc/sys/fs/binfmt_misc/qemu-m68k
              arch-test m68k
              make check-current
              make build-current
              mkdir -p out/qualification
              sha256sum out/rootfs-current-m68k.tar.xz | tee out/qualification/SHA256SUMS
              stat -c "%n %s bytes" out/rootfs-current-m68k.tar.xz | tee out/qualification/SIZE.txt
              tar -tJf out/rootfs-current-m68k.tar.xz | head -200 > out/qualification/ROOTFS_HEAD.txt
              git config --global --add safe.directory /work
              git rev-parse HEAD > out/qualification/GIT_HEAD.txt
            '

      - name: Upload rootfs qualification artifact
        uses: actions/upload-artifact@v4
        with:
          name: m1-1-rootfs-${{ github.sha }}
          path: |
            out/rootfs-current-m68k.tar.xz
            out/qualification/
          if-no-files-found: error
          retention-days: 14
