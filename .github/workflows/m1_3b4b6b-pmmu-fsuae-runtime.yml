name: M1.3b.4b.6b 68030 PMMU FS-UAE runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1_3b4b6b-pmmu-fsuae-runtime.yml'
      - '.github/workflows/m1_3b4b6b-pmmu-ci-trigger'
      - 'ci/fs-uae/m1_3b4b6b_aros_a1200_pmmu_smoke.fs-uae'
      - 'ci/fs-uae/prepare-m1_3b4b6b-pmmu-smoke.sh'
      - 'loader/aros/m68kdeb-68030-pmmu-smoke-trampoline.S'
      - 'loader/aros/m68kdeb-68030-pmmu-smoke-qual.c'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install FS-UAE runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fs-uae curl unzip xorriso xvfb scrot
          fs-uae --version

      - name: Build PMMU smoke blob and qualifier
        run: |
          mkdir -p out/m1-3b4b6b-pmmu
          docker pull amigadev/m68k-amigaos-gcc:latest
          docker run --rm -v "$PWD:/work" -w /work amigadev/m68k-amigaos-gcc:latest sh -lc '
            set -eu
            CC=$(find / -type f -name "m68k-amigaos-gcc" 2>/dev/null | head -n 1)
            NM=$(find / -type f -name "m68k-amigaos-nm" 2>/dev/null | head -n 1)
            OBJCOPY=$(find / -type f -name "m68k-amigaos-objcopy" 2>/dev/null | head -n 1)
            OBJDUMP=$(find / -type f -name "m68k-amigaos-objdump" 2>/dev/null | head -n 1)
            "$CC" -x assembler-with-cpp -c loader/aros/m68kdeb-68030-pmmu-smoke-trampoline.S -o out/m1-3b4b6b-pmmu/smoke.o -m68030 -m68851
            "$NM" -n out/m1-3b4b6b-pmmu/smoke.o > out/m1-3b4b6b-pmmu/smoke.nm
            "$OBJDUMP" -r out/m1-3b4b6b-pmmu/smoke.o > out/m1-3b4b6b-pmmu/smoke.relocs.txt
            "$OBJCOPY" -O binary -j .text out/m1-3b4b6b-pmmu/smoke.o out/m1-3b4b6b-pmmu/smoke.bin
          '
          ! grep -Eq '^[[:space:]]*[0-9a-fA-F]+[[:space:]]+R_' out/m1-3b4b6b-pmmu/smoke.relocs.txt
          python3 - <<'PY'
          from pathlib import Path
          data = Path('out/m1-3b4b6b-pmmu/smoke.bin').read_bytes()
          assert 0 < len(data) <= 4096
          body = ','.join(f'0x{x:02x}' for x in data)
          Path('out/m1-3b4b6b-pmmu/smoke-blob.c').write_text(
              'unsigned char m68kdeb_pmmu_smoke_blob[]={' + body + '};\n'
              'unsigned int m68kdeb_pmmu_smoke_blob_len=sizeof(m68kdeb_pmmu_smoke_blob);\n')
          PY
          docker run --rm -v "$PWD:/work" -w /work amigadev/m68k-amigaos-gcc:latest sh -lc '
            set -eu
            CC=$(find / -type f -name "m68k-amigaos-gcc" 2>/dev/null | head -n 1)
            "$CC" loader/aros/m68kdeb-68030-pmmu-smoke-qual.c out/m1-3b4b6b-pmmu/smoke-blob.c -o out/m1-3b4b6b-pmmu/m68kdeb-68030-pmmu-smoke-qual -m68030 -Os -Wall -Wextra -Werror -Wno-error=pointer-sign -noixemul
          '

      - name: Prepare isolated AROS runtime
        run: sh ci/fs-uae/prepare-m1_3b4b6b-pmmu-smoke.sh

      - name: Boot and qualify PMMU alias instruction fetch
        shell: bash
        run: |
          set -euo pipefail
          root=out/m1-3b4b6b-pmmu/aros-root
          log=out/m1-3b4b6b-pmmu/fs-uae.stdout.log
          xvfb-run -a fs-uae ci/fs-uae/m1_3b4b6b_aros_a1200_pmmu_smoke.fs-uae >"$log" 2>&1 &
          emu=$!
          rc=1
          for i in $(seq 1 180); do
            if [ -f "$root/m1-3b4b6b-pmmu-pass.marker" ] && \
               grep -Fq 'M68KDEB_PMMU_SMOKE_PASS' "$root/m68kdeb-pmmu-smoke-report.txt" 2>/dev/null; then
              rc=0
              break
            fi
            if ! kill -0 "$emu" 2>/dev/null; then
              echo 'FS-UAE exited before PMMU PASS marker' >&2
              break
            fi
            sleep 1
          done
          scrot out/m1-3b4b6b-pmmu/screenshots/m1-3b4b6b-pmmu.png || true
          kill -INT "$emu" 2>/dev/null || true
          sleep 2
          kill -TERM "$emu" 2>/dev/null || true
          wait "$emu" 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then
            echo 'M1.3b.4b.6b FAIL: FS-UAE did not produce PMMU PASS evidence' >&2
            printf 'startup=%s\narmed=%s\nreturned=%s\npass=%s\n' \
              "$([ -f "$root/m1-3b4b6b-pmmu-startup.marker" ] && echo 1 || echo 0)" \
              "$([ -f "$root/m1-3b4b6b-pmmu-armed.marker" ] && echo 1 || echo 0)" \
              "$([ -f "$root/m1-3b4b6b-pmmu-returned.marker" ] && echo 1 || echo 0)" \
              "$([ -f "$root/m1-3b4b6b-pmmu-pass.marker" ] && echo 1 || echo 0)" >&2
            cat "$root/m68kdeb-pmmu-smoke-report.txt" >&2 || true
            tail -200 "$log" >&2 || true
            exit 1
          fi
          test -f "$root/m1-3b4b6b-pmmu-startup.marker"
          test -f "$root/m1-3b4b6b-pmmu-armed.marker"
          test -f "$root/m1-3b4b6b-pmmu-returned.marker"
          test -f "$root/m1-3b4b6b-pmmu-pass.marker"
          echo 'PASS: FS-UAE survived supervisor-program MC68030 PMMU alias instruction fetch'

      - name: Upload FS-UAE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-3b4b6b-pmmu-fsuae-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            out/m1-3b4b6b-pmmu/RUNTIME_PROVENANCE.txt
            out/m1-3b4b6b-pmmu/ORIGINAL-Startup-Sequence
            out/m1-3b4b6b-pmmu/aros-root/S/Startup-Sequence
            out/m1-3b4b6b-pmmu/aros-root/m68kdeb-pmmu-smoke-report.txt
            out/m1-3b4b6b-pmmu/aros-root/m1-3b4b6b-pmmu-*.marker
            out/m1-3b4b6b-pmmu/smoke.relocs.txt
            out/m1-3b4b6b-pmmu/fs-uae.stdout.log
            out/m1-3b4b6b-pmmu/screenshots/
