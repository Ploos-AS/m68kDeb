name: M1.3b.2 AROS kernel load + bootinfo build

on:
  workflow_dispatch:
  push:
    paths:
      - 'loader/aros/m68kdeb-loader.c'
      - 'kernel/build-amiga.sh'
      - 'ci/fs-uae/m1_3b2_aros_a1200_bootinfo_build.fs-uae'
      - 'ci/fs-uae/prepare-m1_3b2-bootinfo-build.sh'
      - '.github/workflows/m1_3b2-aros-kernel-bootinfo-build.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl file flex \
            fs-uae gcc-m68k-linux-gnu gzip libelf-dev libssl-dev make \
            scrot unzip xvfb xorriso xz-utils
          fs-uae --version
          docker --version

      - name: Build Linux 7.2 Amiga kernel
        run: sh kernel/build-amiga.sh

      - name: Probe and build loader with Bebbo
        run: |
          mkdir -p out/m68kdeb-loader
          docker pull amigadev/m68k-amigaos-gcc:latest
          docker run --rm \
            -v "$PWD:/work" -w /work \
            amigadev/m68k-amigaos-gcc:latest \
            sh -lc '
              set -eu
              find / -type f \( -name "m68k-amigaos-gcc" -o -name "*amigaos*gcc" -o -name "m68k-*-gcc" \) 2>/dev/null | sort | tee /tmp/compiler-candidates.txt
              CC=$(awk "/\/m68k-amigaos-gcc$/ { print; exit }" /tmp/compiler-candidates.txt)
              if [ -z "$CC" ]; then CC=$(head -n 1 /tmp/compiler-candidates.txt || true); fi
              test -n "$CC" && test -x "$CC"
              echo "compiler_path=$CC" | tee /work/out/m68kdeb-loader/TOOLCHAIN.txt
              "$CC" --version | head -n 3 | tee -a /work/out/m68kdeb-loader/TOOLCHAIN.txt
              "$CC" loader/aros/m68kdeb-loader.c \
                -o out/m68kdeb-loader/m68kdeb-loader \
                -m68000 -Os -Wall -Wextra -noixemul
            '
          file out/m68kdeb-loader/m68kdeb-loader
          sha256sum out/m68kdeb-loader/m68kdeb-loader | tee out/m68kdeb-loader/SHA256SUMS

      - name: Prepare matching-AROS runtime
        run: sh ci/fs-uae/prepare-m1_3b2-bootinfo-build.sh

      - name: Run kernel load and bootinfo builder under FS-UAE
        run: |
          mkdir -p out/m1-3b2/logs out/m1-3b2/screenshots
          set +e
          xvfb-run -a sh -eu -c '
            fs-uae ci/fs-uae/m1_3b2_aros_a1200_bootinfo_build.fs-uae >out/m1-3b2/fs-uae.stdout.log 2>&1 &
            emu=$!
            startup=0
            returned=0
            report=0
            for i in $(seq 1 240); do
              [ -f out/m1-3b2/aros-root/m1-3b2-startup.marker ] && startup=1
              [ -f out/m1-3b2/aros-root/m1-3b2-loader-returned.marker ] && returned=1
              if [ -f out/m1-3b2/aros-root/m68kdeb-bootinfo-report.txt ] && \
                 grep -q "M68KDEB_KERNEL_LOADED" out/m1-3b2/aros-root/m68kdeb-bootinfo-report.txt && \
                 grep -q "kernel_amiga_bootinfo_version=0x00020000" out/m1-3b2/aros-root/m68kdeb-bootinfo-report.txt && \
                 grep -q "bootinfo_machtype=1" out/m1-3b2/aros-root/m68kdeb-bootinfo-report.txt && \
                 grep -q "bootinfo_memchunks=" out/m1-3b2/aros-root/m68kdeb-bootinfo-report.txt && \
                 grep -q "handoff=NOT_ATTEMPTED" out/m1-3b2/aros-root/m68kdeb-bootinfo-report.txt && \
                 grep -q "M68KDEB_BOOTINFO_BUILD_OK" out/m1-3b2/aros-root/m68kdeb-bootinfo-report.txt; then
                report=1
              fi
              [ "$returned" -eq 1 ] && [ "$report" -eq 1 ] && break
              if ! kill -0 "$emu" 2>/dev/null; then break; fi
              sleep 1
            done
            scrot out/m1-3b2/screenshots/m1-3b2-bootinfo.png || true
            kill -INT "$emu" 2>/dev/null || true
            sleep 2
            kill -TERM "$emu" 2>/dev/null || true
            wait "$emu" 2>/dev/null || true
            printf "startup=%s\nloader_returned=%s\nreport_valid=%s\n" "$startup" "$returned" "$report" >out/m1-3b2/BOUNDARIES.txt
            if [ "$startup" -eq 1 ] && [ "$returned" -eq 1 ] && [ "$report" -eq 1 ]; then
              echo "classification=AROS_KERNEL_LOAD_BOOTINFO_BUILD_PASS" >out/m1-3b2/CLASSIFICATION.txt
              exit 0
            fi
            echo "classification=AROS_KERNEL_LOAD_BOOTINFO_BUILD_FAIL" >out/m1-3b2/CLASSIFICATION.txt
            exit 1
          '
          rc=$?
          set -e
          echo '=== BOUNDARIES ==='
          cat out/m1-3b2/BOUNDARIES.txt || true
          echo '=== CLASSIFICATION ==='
          cat out/m1-3b2/CLASSIFICATION.txt || true
          echo '=== BOOTINFO REPORT ==='
          cat out/m1-3b2/aros-root/m68kdeb-bootinfo-report.txt || true
          echo '=== FS-UAE TAIL ==='
          tail -200 out/m1-3b2/fs-uae.stdout.log || true
          exit "$rc"

      - name: Record qualification PASS
        run: |
          {
            echo 'result=PASS'
            echo "git=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo 'scope=kernel loaded and Linux/m68k bootinfo constructed/self-validated under AROS; no handoff'
            cat out/m68kdeb-loader/TOOLCHAIN.txt
            cat out/m1-3b2/CLASSIFICATION.txt
            cat out/m1-3b2/BOUNDARIES.txt
            cat out/m1-3b2/RUNTIME_PROVENANCE.txt
            cat out/m68kdeb-loader/SHA256SUMS
            sha256sum out/kernel-amiga/vmlinux-m68k-amiga
            fs-uae --version | head -n 1 | sed 's/^/fs_uae=/'
          } >out/m1-3b2/RESULT.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-3b2-aros-bootinfo-${{ github.sha }}
          path: |
            out/m1-3b2/RESULT.txt
            out/m1-3b2/BOUNDARIES.txt
            out/m1-3b2/CLASSIFICATION.txt
            out/m1-3b2/RUNTIME_PROVENANCE.txt
            out/m1-3b2/ORIGINAL-Startup-Sequence
            out/m1-3b2/aros-root/S/Startup-Sequence
            out/m1-3b2/aros-root/m1-3b2-*.marker
            out/m1-3b2/aros-root/m68kdeb-bootinfo-report.txt
            out/m1-3b2/fs-uae.stdout.log
            out/m1-3b2/logs/
            out/m1-3b2/screenshots/
            out/m1-3b2/rom/
            out/m68kdeb-loader/TOOLCHAIN.txt
            out/m68kdeb-loader/SHA256SUMS
            out/kernel-amiga/VERSION
            out/kernel-amiga/SOURCE_URL
            out/kernel-amiga/linux-source.SHA256
          if-no-files-found: warn
          retention-days: 14
