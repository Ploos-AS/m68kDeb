name: M1.3b.4b.6b 68030 PMMU WinUAE Wine runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1_3b4b6b-pmmu-winuae-wine-runtime.yml'
      - '.github/workflows/m1_3b4b6b-pmmu-ci-trigger'
      - 'ci/winuae/m1_3b4b6b_aros_a1200_pmmu_smoke.uae'
      - 'ci/fs-uae/prepare-m1_3b4b6b-pmmu-smoke.sh'
      - 'loader/aros/m68kdeb-68030-pmmu-smoke-trampoline.S'
      - 'loader/aros/m68kdeb-68030-pmmu-smoke-qual.c'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Wine runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64-preloader unzip curl xvfb xorriso
          wine --version

      - name: Download WinUAE 6.0.3 x64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/winuae-6.0.3
          url='https://download.abime.net/winuae/releases/WinUAE6030_x64.zip'
          curl -fL --retry 3 "$url" -o out/winuae-6.0.3/WinUAE6030_x64.zip
          unzip -q out/winuae-6.0.3/WinUAE6030_x64.zip -d out/winuae-6.0.3/bundle
          exe=$(find out/winuae-6.0.3/bundle -type f \( -iname 'winuae64.exe' -o -iname 'winuae.exe' \) | head -n1)
          test -n "$exe"
          echo "WINUAE_EXE=$PWD/$exe" >> "$GITHUB_ENV"
          sha256sum out/winuae-6.0.3/WinUAE6030_x64.zip | tee out/winuae-6.0.3/SHA256.txt

      - name: Initialize Wine prefix and record provenance
        shell: bash
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ github.workspace }}/out/wine-prefix
          WINEARCH: win64
        run: |
          set -euo pipefail
          mkdir -p "$WINEPREFIX"
          xvfb-run -a wineboot -u
          {
            echo 'WinUAE release: 6.0.3 x64'
            echo "WinUAE binary: $WINUAE_EXE"
            wine --version
            dpkg-query -W -f='wine64-preloader=${Version}\n' wine64-preloader
            sha256sum "$WINUAE_EXE"
          } | tee out/winuae-6.0.3/RUNTIME_PROVENANCE.txt

      - name: Build PMMU smoke blob and qualifier
        run: |
          mkdir -p out/m1-3b4b6b-pmmu
          docker pull amigadev/m68k-amigaos-gcc:latest
          docker run --rm -v "$PWD:/work" -w /work amigadev/m68k-amigaos-gcc:latest sh -lc '
            set -eu
            CC=$(find / -type f -name "m68k-amigaos-gcc" 2>/dev/null | head -n 1)
            NM=$(find / -type f -name "m68k-amigaos-nm" 2>/dev/null | head -n 1)
            OBJCOPY=$(find / -type f -name "m68k-amigaos-objcopy" 2>/dev/null | head -n 1)
            OBJDUMP=$(find / -type f -name "m68k-amigaos-objdump" 2>/dev/null | head -n 1)
            "$CC" -x assembler-with-cpp -c loader/aros/m68kdeb-68030-pmmu-smoke-trampoline.S -o out/m1-3b4b6b-pmmu/smoke.o -m68030 -m68851
            "$NM" -n out/m1-3b4b6b-pmmu/smoke.o > out/m1-3b4b6b-pmmu/smoke.nm
            "$OBJDUMP" -r out/m1-3b4b6b-pmmu/smoke.o > out/m1-3b4b6b-pmmu/smoke.relocs.txt
            "$OBJCOPY" -O binary -j .text out/m1-3b4b6b-pmmu/smoke.o out/m1-3b4b6b-pmmu/smoke.bin
          '
          ! grep -Eq '^[[:space:]]*[0-9a-fA-F]+[[:space:]]+R_' out/m1-3b4b6b-pmmu/smoke.relocs.txt
          python3 - <<'PY'
          from pathlib import Path
          data=Path('out/m1-3b4b6b-pmmu/smoke.bin').read_bytes()
          assert 0 < len(data) <= 4096
          body=','.join(f'0x{x:02x}' for x in data)
          Path('out/m1-3b4b6b-pmmu/smoke-blob.c').write_text(
              'unsigned char m68kdeb_pmmu_smoke_blob[]={' + body + '};\n'
              'unsigned int m68kdeb_pmmu_smoke_blob_len=sizeof(m68kdeb_pmmu_smoke_blob);\n')
          PY
          docker run --rm -v "$PWD:/work" -w /work amigadev/m68k-amigaos-gcc:latest sh -lc '
            set -eu
            CC=$(find / -type f -name "m68k-amigaos-gcc" 2>/dev/null | head -n 1)
            "$CC" loader/aros/m68kdeb-68030-pmmu-smoke-qual.c out/m1-3b4b6b-pmmu/smoke-blob.c -o out/m1-3b4b6b-pmmu/m68kdeb-68030-pmmu-smoke-qual -m68030 -Os -Wall -Wextra -Werror -Wno-error=pointer-sign -noixemul
          '

      - name: Prepare AROS runtime
        run: sh ci/fs-uae/prepare-m1_3b4b6b-pmmu-smoke.sh

      - name: Run PMMU smoke test on WinUAE 6.0.3 via Wine
        shell: bash
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ github.workspace }}/out/wine-prefix
          WINEARCH: win64
        run: |
          set -euo pipefail
          cfg=$(winepath -w "$PWD/ci/winuae/m1_3b4b6b_aros_a1200_pmmu_smoke.uae")
          timeout 150 xvfb-run -a wine "$WINUAE_EXE" -f "$cfg" \
            >out/m1-3b4b6b-pmmu/winuae.stdout.log \
            2>out/m1-3b4b6b-pmmu/winuae.stderr.log || rc=$?
          rc=${rc:-0}
          if grep -Fq 'Reserve  0xa0100000 bytes failed!' out/m1-3b4b6b-pmmu/winuae.stdout.log; then
            echo 'FAIL: WinUAE could not reserve its low-address memory window under Wine' >&2
            exit 1
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "FAIL: WinUAE/Wine exited unexpectedly with rc=$rc" >&2
            exit "$rc"
          fi

      - name: Qualify PMMU alias instruction fetch
        shell: bash
        run: |
          set -euo pipefail
          root=out/m1-3b4b6b-pmmu/aros-root
          test -f "$root/m1-3b4b6b-pmmu-armed.marker"
          test -f "$root/m1-3b4b6b-pmmu-returned.marker"
          test -f "$root/m1-3b4b6b-pmmu-pass.marker"
          test -f "$root/m68kdeb-pmmu-smoke-report.txt"
          grep -Fq 'M68KDEB_PMMU_SMOKE_PASS' "$root/m68kdeb-pmmu-smoke-report.txt"
          echo 'PASS: WinUAE 6.0.3 via Wine survived supervisor-program PMMU alias instruction fetch'

      - name: Upload WinUAE Wine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-3b4b6b-pmmu-winuae-wine-evidence
          if-no-files-found: warn
          path: |
            out/winuae-6.0.3/SHA256.txt
            out/winuae-6.0.3/RUNTIME_PROVENANCE.txt
            out/m1-3b4b6b-pmmu/winuae.stdout.log
            out/m1-3b4b6b-pmmu/winuae.stderr.log
            out/m1-3b4b6b-pmmu/smoke.relocs.txt
            out/m1-3b4b6b-pmmu/aros-root/m68kdeb-pmmu-smoke-report.txt
            out/m1-3b4b6b-pmmu/aros-root/m1-3b4b6b-pmmu-armed.marker
            out/m1-3b4b6b-pmmu/aros-root/m1-3b4b6b-pmmu-returned.marker
            out/m1-3b4b6b-pmmu/aros-root/m1-3b4b6b-pmmu-pass.marker
