name: M1.3b.1 AROS-native loader probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'loader/aros/m68kdeb-loader.c'
      - 'ci/fs-uae/m1_3b1_aros_a1200_loader_probe.fs-uae'
      - 'ci/fs-uae/prepare-m1_3b1-loader-probe.sh'
      - '.github/workflows/m1_3b1-aros-native-loader-probe.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FS-UAE runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl file fs-uae scrot unzip xvfb xorriso
          fs-uae --version
          docker --version

      - name: Build with Bebbo m68k-amigaos-gcc
        run: |
          mkdir -p out/m68kdeb-loader
          docker pull amigadev/m68k-amigaos-gcc:latest
          docker run --rm \
            -v "$PWD:/work" -w /work \
            amigadev/m68k-amigaos-gcc:latest \
            sh -lc 'm68k-amigaos-gcc --version | head -n 3; m68k-amigaos-gcc loader/aros/m68kdeb-loader.c -o out/m68kdeb-loader/m68kdeb-loader -m68000 -Os -Wall -Wextra -noixemul'
          file out/m68kdeb-loader/m68kdeb-loader
          sha256sum out/m68kdeb-loader/m68kdeb-loader | tee out/m68kdeb-loader/SHA256SUMS

      - name: Prepare matching-AROS runtime
        run: sh ci/fs-uae/prepare-m1_3b1-loader-probe.sh

      - name: Run loader probe under FS-UAE
        run: |
          mkdir -p out/m1-3b1/logs out/m1-3b1/screenshots
          set +e
          xvfb-run -a sh -eu -c '
            fs-uae ci/fs-uae/m1_3b1_aros_a1200_loader_probe.fs-uae >out/m1-3b1/fs-uae.stdout.log 2>&1 &
            emu=$!
            startup=0
            returned=0
            report=0
            for i in $(seq 1 180); do
              [ -f out/m1-3b1/aros-root/m1-3b1-startup.marker ] && startup=1
              [ -f out/m1-3b1/aros-root/m1-3b1-loader-returned.marker ] && returned=1
              if [ -f out/m1-3b1/aros-root/m68kdeb-loader-report.txt ] && \
                 grep -q "M68KDEB_LOADER_PROBE_OK" out/m1-3b1/aros-root/m68kdeb-loader-report.txt && \
                 grep -q "memory_regions=" out/m1-3b1/aros-root/m68kdeb-loader-report.txt && \
                 grep -q "mem\[0\]" out/m1-3b1/aros-root/m68kdeb-loader-report.txt; then
                report=1
              fi
              [ "$returned" -eq 1 ] && [ "$report" -eq 1 ] && break
              if ! kill -0 "$emu" 2>/dev/null; then break; fi
              sleep 1
            done
            scrot out/m1-3b1/screenshots/m1-3b1-loader.png || true
            kill -INT "$emu" 2>/dev/null || true
            sleep 2
            kill -TERM "$emu" 2>/dev/null || true
            wait "$emu" 2>/dev/null || true
            printf "startup=%s\nloader_returned=%s\nreport_valid=%s\n" "$startup" "$returned" "$report" >out/m1-3b1/BOUNDARIES.txt
            if [ "$startup" -eq 1 ] && [ "$returned" -eq 1 ] && [ "$report" -eq 1 ]; then
              echo "classification=AROS_NATIVE_LOADER_PROBE_PASS" >out/m1-3b1/CLASSIFICATION.txt
              exit 0
            fi
            echo "classification=AROS_NATIVE_LOADER_PROBE_FAIL" >out/m1-3b1/CLASSIFICATION.txt
            exit 1
          '
          rc=$?
          set -e
          echo '=== BOUNDARIES ==='
          cat out/m1-3b1/BOUNDARIES.txt || true
          echo '=== CLASSIFICATION ==='
          cat out/m1-3b1/CLASSIFICATION.txt || true
          echo '=== LOADER REPORT ==='
          cat out/m1-3b1/aros-root/m68kdeb-loader-report.txt || true
          echo '=== FS-UAE TAIL ==='
          tail -200 out/m1-3b1/fs-uae.stdout.log || true
          exit "$rc"

      - name: Record qualification PASS
        run: |
          {
            echo 'result=PASS'
            echo "git=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo 'toolchain=Bebbo m68k-amigaos-gcc via amigadev/m68k-amigaos-gcc:latest'
            cat out/m1-3b1/CLASSIFICATION.txt
            cat out/m1-3b1/BOUNDARIES.txt
            cat out/m1-3b1/RUNTIME_PROVENANCE.txt
            cat out/m68kdeb-loader/SHA256SUMS
            fs-uae --version | head -n 1 | sed 's/^/fs_uae=/'
          } >out/m1-3b1/RESULT.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-3b1-aros-loader-${{ github.sha }}
          path: |
            out/m1-3b1/RESULT.txt
            out/m1-3b1/BOUNDARIES.txt
            out/m1-3b1/CLASSIFICATION.txt
            out/m1-3b1/RUNTIME_PROVENANCE.txt
            out/m1-3b1/ORIGINAL-Startup-Sequence
            out/m1-3b1/aros-root/S/Startup-Sequence
            out/m1-3b1/aros-root/m1-3b1-*.marker
            out/m1-3b1/aros-root/m68kdeb-loader-report.txt
            out/m1-3b1/fs-uae.stdout.log
            out/m1-3b1/logs/
            out/m1-3b1/screenshots/
            out/m1-3b1/rom/
            out/m68kdeb-loader/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
