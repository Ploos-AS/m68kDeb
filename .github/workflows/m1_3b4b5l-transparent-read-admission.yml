name: M1.3b.4b.5l transparent read admission

on:
  workflow_dispatch:
  push:
    paths:
      - 'loader/aros/m68kdeb-68030-physread-tt.c'
      - 'loader/aros/m68kdeb-68030-physread-tt.h'
      - 'loader/aros/m68kdeb-68030-evidence.h'
      - 'tests/test_68030_physread_tt.c'
      - 'docs/M1_3B4B5L_TRANSPARENT_READ_ADMISSION.md'
      - '.github/workflows/m1_3b4b5l-transparent-read-admission.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run host admission tests
        run: |
          mkdir -p out/m1-3b4b5l
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            tests/test_68030_physread_tt.c \
            loader/aros/m68kdeb-68030-physread-tt.c \
            -o out/m1-3b4b5l/test-68030-ttread
          out/m1-3b4b5l/test-68030-ttread | tee out/m1-3b4b5l/RESULT.txt
          grep -q 'M68KDEB_68030_TTREAD_TEST_PASS' out/m1-3b4b5l/RESULT.txt

      - name: Build admission gate for m68k Amiga target
        run: |
          docker pull amigadev/m68k-amigaos-gcc:latest
          docker run --rm -v "$PWD:/work" -w /work \
            amigadev/m68k-amigaos-gcc:latest sh -lc '
              set -eu
              CC=$(find / -type f -name "m68k-amigaos-gcc" 2>/dev/null | head -n 1)
              test -x "$CC"
              "$CC" -c loader/aros/m68kdeb-68030-physread-tt.c \
                -o out/m1-3b4b5l/m68kdeb-68030-physread-tt.o \
                -m68000 -Os -Wall -Wextra -Werror -noixemul
            '
          file out/m1-3b4b5l/m68kdeb-68030-physread-tt.o | tee out/m1-3b4b5l/FILE.txt
          sha256sum out/m1-3b4b5l/m68kdeb-68030-physread-tt.o | tee out/m1-3b4b5l/SHA256SUMS

      - name: Enforce reversible admission boundary
        run: |
          ! grep -R -n -E 'pmove|ptest|pflusha?|SuperState|m68kdeb_takeover_68030_commit|TT0|TT1' \
            loader/aros/m68kdeb-68030-physread-tt.c loader/aros/m68kdeb-68030-physread-tt.h
          grep -q 'does not dereference the admitted address' docs/M1_3B4B5L_TRANSPARENT_READ_ADMISSION.md
          grep -q 'provider must fail closed' docs/M1_3B4B5L_TRANSPARENT_READ_ADMISSION.md
          printf '%s\n' \
            'milestone=M1.3b.4b.5l' \
            'admission=transparent-translation-identity' \
            'physical_memory_read=NOT_ATTEMPTED' \
            'mmu_mutation=FORBIDDEN' \
            'runtime_execution=NOT_ATTEMPTED' \
            'result=PASS' | tee out/m1-3b4b5l/CLASSIFICATION.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: m1-3b4b5l-transparent-read-admission-${{ github.sha }}
          path: out/m1-3b4b5l/
          retention-days: 14
