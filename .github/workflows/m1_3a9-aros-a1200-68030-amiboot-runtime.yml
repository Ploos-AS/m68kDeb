name: M1.3a.9 AROS A1200 68030 matching-ROM amiboot runtime

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/m1_3a9-aros-a1200-68030-amiboot-runtime.yml'
      - 'ci/fs-uae/m1_3a9_aros_a1200_68030_amiboot.fs-uae'
      - 'ci/fs-uae/prepare-m1_3a9-runtime.sh'
      - 'kernel/build-amiga.sh'
      - 'initramfs/build-amiga.sh'
      - 'platforms/amiga/**'
      - 'scripts/check-amiga-bootstrap.sh'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl dpkg-dev flex \
            fs-uae gcc-m68k-linux-gnu gzip libelf-dev libssl-dev make \
            scrot socat unzip xvfb xorriso xz-utils
          fs-uae --version

      - name: Build M1.3 Amiga bundle
        run: |
          sh kernel/build-amiga.sh
          sh initramfs/build-amiga.sh
          sh platforms/amiga/fetch-amiboot.sh
          mkdir -p out/m68kdeb-amiga
          cp out/amiboot/amiboot out/m68kdeb-amiga/amiboot
          cp out/kernel-amiga/vmlinux-m68k-amiga out/m68kdeb-amiga/
          cp out/kernel-amiga/vmlinuz-m68k-amiga out/m68kdeb-amiga/
          cp out/initramfs-amiga/initramfs-m68kdeb.gz out/m68kdeb-amiga/
          cp platforms/amiga/bootstrap/Start-m68kDeb out/m68kdeb-amiga/
          cp platforms/amiga/bootstrap/Start-m68kDeb-Serial out/m68kdeb-amiga/
          chmod +x out/m68kdeb-amiga/Start-m68kDeb out/m68kdeb-amiga/Start-m68kDeb-Serial
          {
            echo 'M1.3a.9 runtime bundle provenance'
            echo "git=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo -n 'kernel_version='; cat out/kernel-amiga/VERSION
            echo -n 'kernel_source='; cat out/kernel-amiga/SOURCE_URL
            echo -n 'busybox_source='; cat out/initramfs-amiga/BUSYBOX_SOURCE_URL
            echo -n 'amiboot_source='; cat out/amiboot/SOURCE_URL
          } > out/m68kdeb-amiga/PROVENANCE.txt
          (cd out/m68kdeb-amiga && sha256sum amiboot vmlinux-m68k-amiga vmlinuz-m68k-amiga initramfs-m68kdeb.gz Start-m68kDeb Start-m68kDeb-Serial PROVENANCE.txt > SHA256SUMS)
          sh scripts/check-amiga-bootstrap.sh out/m68kdeb-amiga

      - name: Prepare pinned AROS runtime root with isolated matching ROM pair
        run: OUT=out/m1-3a9 sh ci/fs-uae/prepare-m1_3a9-runtime.sh

      - name: Boot matching AROS ROM pair through amiboot and Linux
        run: |
          mkdir -p out/m1-3a9/logs out/m1-3a9/screenshots
          rm -f /tmp/m68kdeb-fsuae-serial /tmp/m68kdeb-capture-serial

          socat -d -d \
            pty,raw,echo=0,link=/tmp/m68kdeb-fsuae-serial \
            pty,raw,echo=0,link=/tmp/m68kdeb-capture-serial \
            2>out/m1-3a9/socat.log &
          bridge=$!

          for i in $(seq 1 20); do
            [ -e /tmp/m68kdeb-fsuae-serial ] && [ -e /tmp/m68kdeb-capture-serial ] && break
            sleep 1
          done
          [ -e /tmp/m68kdeb-fsuae-serial ] && [ -e /tmp/m68kdeb-capture-serial ] || exit 1

          timeout 600 cat /tmp/m68kdeb-capture-serial >out/m1-3a9/serial.log &
          serial=$!

          xvfb-run -a sh -eu -c '
            fs-uae ci/fs-uae/m1_3a9_aros_a1200_68030_amiboot.fs-uae >out/m1-3a9/fs-uae.stdout.log 2>&1 &
            emu=$!
            found=0
            for i in $(seq 1 600); do
              if grep -Fq "M1.3 bootstrap reached userspace." out/m1-3a9/serial.log 2>/dev/null; then
                found=1
                break
              fi
              if ! kill -0 "$emu" 2>/dev/null; then
                echo "FS-UAE exited before Linux userspace marker" >&2
                break
              fi
              sleep 1
            done
            scrot out/m1-3a9/screenshots/m1-3a9-runtime.png || true
            kill -INT "$emu" 2>/dev/null || true
            sleep 2
            kill -TERM "$emu" 2>/dev/null || true
            wait "$emu" 2>/dev/null || true
            if [ "$found" -ne 1 ]; then
              echo "M1.3a.9 Linux userspace marker not observed" >&2
              echo "=== serial ===" >&2
              cat out/m1-3a9/serial.log >&2 || true
              echo "=== fs-uae ===" >&2
              tail -200 out/m1-3a9/fs-uae.stdout.log >&2 || true
              exit 1
            fi
          '
          rc=$?
          kill -TERM "$serial" 2>/dev/null || true
          kill -TERM "$bridge" 2>/dev/null || true
          wait "$serial" 2>/dev/null || true
          wait "$bridge" 2>/dev/null || true
          exit "$rc"

      - name: Record runtime PASS
        run: |
          {
            echo "result=PASS"
            echo "git=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "machine=A1200"
            echo "cpu=68030"
            echo "mmu=68030"
            echo "cpu_speed=real"
            echo "accelerator=none"
            echo "accelerator_rom=none"
            echo "rom=AROS-20260908 matching aros-rom.bin + aros-ext.bin"
            echo "rom_location=isolated from writable DH0"
            echo "aros_payload_sha256=799a327bdd50c008c7d35fe57524876b0780d4db4caf8df1cea6fcaf123cd46b"
            echo "aros_iso_sha256=a9087e8095c58d554a4b3bc85dd35ac9d2da6954bcc066a419d8a7a06c358e65"
            echo "amiboot=invoked"
            echo "linux=invoked"
            echo "marker=M1.3 bootstrap reached userspace."
            fs-uae --version | head -n 1 | sed 's/^/fs_uae=/'
          } > out/m1-3a9/RESULT.txt

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-3a9-aros-a1200-68030-amiboot-${{ github.sha }}
          path: |
            out/m1-3a9/
            out/m68kdeb-amiga/SHA256SUMS
            out/kernel-amiga/linux-source.SHA256
            out/initramfs-amiga/busybox-static.SHA256
            out/amiboot/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
