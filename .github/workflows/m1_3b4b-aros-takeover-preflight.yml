name: M1.3b.4b AROS takeover preflight

on:
  workflow_dispatch:
  push:
    paths:
      - 'loader/aros/m68kdeb-loader.c'
      - 'loader/aros/m68kdeb-layout.c'
      - 'loader/aros/m68kdeb-layout.h'
      - 'loader/aros/m68kdeb-handoff.c'
      - 'loader/aros/m68kdeb-handoff.h'
      - 'loader/aros/m68kdeb-takeover.c'
      - 'loader/aros/m68kdeb-takeover.h'
      - 'loader/aros/m68kdeb-takeover-68030.S'
      - 'loader/aros/m68kdeb-takeover-68030-mmuprobe.S'
      - '.github/workflows/m1_3b4b-aros-takeover-preflight.yml'

permissions:
  contents: read

jobs:
  build-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build reversible loader and isolated 68030 objects with Bebbo
        run: |
          mkdir -p out/m1-3b4b
          docker pull amigadev/m68k-amigaos-gcc:latest
          docker run --rm \
            -v "$PWD:/work" -w /work \
            amigadev/m68k-amigaos-gcc:latest \
            sh -lc '
              set -eu
              find / -type f \( -name "m68k-amigaos-gcc" -o -name "*amigaos*gcc" -o -name "m68k-*-gcc" \) 2>/dev/null | sort > /tmp/compiler-candidates.txt
              CC=$(awk "/\/m68k-amigaos-gcc$/ { print; exit }" /tmp/compiler-candidates.txt)
              if [ -z "$CC" ]; then CC=$(head -n 1 /tmp/compiler-candidates.txt || true); fi
              test -n "$CC" && test -x "$CC"
              "$CC" --version | head -n 3
              "$CC" \
                loader/aros/m68kdeb-loader.c \
                loader/aros/m68kdeb-layout.c \
                loader/aros/m68kdeb-handoff.c \
                loader/aros/m68kdeb-takeover.c \
                -o out/m1-3b4b/m68kdeb-loader \
                -m68000 -Os -Wall -Wextra -Werror \
                -Wno-error=pointer-sign -Wno-error=int-conversion \
                -noixemul
              "$CC" -c loader/aros/m68kdeb-takeover-68030.S \
                -o out/m1-3b4b/m68kdeb-takeover-68030.o \
                -m68030 -m68851
              "$CC" -c loader/aros/m68kdeb-takeover-68030-mmuprobe.S \
                -o out/m1-3b4b/m68kdeb-takeover-68030-mmuprobe.o \
                -m68030 -m68851
            '
          file out/m1-3b4b/m68kdeb-loader \
               out/m1-3b4b/m68kdeb-takeover-68030.o \
               out/m1-3b4b/m68kdeb-takeover-68030-mmuprobe.o
          sha256sum out/m1-3b4b/m68kdeb-loader \
                    out/m1-3b4b/m68kdeb-takeover-68030.o \
                    out/m1-3b4b/m68kdeb-takeover-68030-mmuprobe.o \
            | tee out/m1-3b4b/SHA256SUMS

      - name: Verify reversible loader and isolated takeover objects
        run: |
          strings out/m1-3b4b/m68kdeb-loader | grep -q 'M68KDEB_TAKEOVER_PREFLIGHT_OK'
          strings out/m1-3b4b/m68kdeb-loader | grep -q 'handoff=NOT_ATTEMPTED'
          if strings out/m1-3b4b/m68kdeb-loader | grep -q 'm68kdeb_takeover_68030_commit'; then
            echo 'irreversible 68030 commit path unexpectedly linked into loader' >&2
            exit 1
          fi
          if strings out/m1-3b4b/m68kdeb-loader | grep -q 'm68kdeb_takeover_68030_cache_mmu_instruction_probe'; then
            echo 'cache/MMU instruction probe unexpectedly linked into loader' >&2
            exit 1
          fi
          docker run --rm -v "$PWD:/work" -w /work \
            amigadev/m68k-amigaos-gcc:latest sh -lc '
              set -eu
              NM=$(find /opt/amiga -type f -name "m68k-amigaos-nm" | head -n 1)
              OBJDUMP=$(find /opt/amiga -type f -name "m68k-amigaos-objdump" | head -n 1)
              test -x "$NM" && test -x "$OBJDUMP"

              "$NM" out/m1-3b4b/m68kdeb-takeover-68030.o > out/m1-3b4b/m68kdeb-takeover-68030.nm
              cat out/m1-3b4b/m68kdeb-takeover-68030.nm
              grep -Eq "[[:space:]][Tt][[:space:]]m68kdeb_takeover_68030_supervisor_probe$" out/m1-3b4b/m68kdeb-takeover-68030.nm
              grep -Eq "[[:space:]][Tt][[:space:]]m68kdeb_takeover_68030_commit$" out/m1-3b4b/m68kdeb-takeover-68030.nm
              grep -Eq "[[:space:]][Tt][[:space:]]m68kdeb_takeover_68030_commit_boundary$" out/m1-3b4b/m68kdeb-takeover-68030.nm
              grep -Eq "[[:space:]][Tt][[:space:]]m68kdeb_takeover_68030_cache_mmu_boundary$" out/m1-3b4b/m68kdeb-takeover-68030.nm
              "$OBJDUMP" -dr out/m1-3b4b/m68kdeb-takeover-68030.o > out/m1-3b4b/m68kdeb-takeover-68030.disasm
              cat out/m1-3b4b/m68kdeb-takeover-68030.disasm
              grep -Eiq "movec.*cacr|cacr.*movec" out/m1-3b4b/m68kdeb-takeover-68030.disasm
              grep -Eiq "pmove.*tc|tc.*pmove" out/m1-3b4b/m68kdeb-takeover-68030.disasm
              grep -Eiq "pflusha" out/m1-3b4b/m68kdeb-takeover-68030.disasm
              grep -Eq "^[[:space:]]*ori\\.w[[:space:]]+#0x0700,%sr$" loader/aros/m68kdeb-takeover-68030.S

              COMMIT=$(awk "/m68kdeb_takeover_68030_commit_boundary:/ {print \$1; exit}" out/m1-3b4b/m68kdeb-takeover-68030.disasm)
              MMU=$(awk "/m68kdeb_takeover_68030_cache_mmu_boundary:/ {print \$1; exit}" out/m1-3b4b/m68kdeb-takeover-68030.disasm)
              test -n "$COMMIT" && test -n "$MMU"
              test $((0x$MMU)) -gt $((0x$COMMIT))

              "$NM" out/m1-3b4b/m68kdeb-takeover-68030-mmuprobe.o > out/m1-3b4b/m68kdeb-takeover-68030-mmuprobe.nm
              grep -Eq "[[:space:]][Tt][[:space:]]m68kdeb_takeover_68030_cache_mmu_instruction_probe$" out/m1-3b4b/m68kdeb-takeover-68030-mmuprobe.nm
              "$OBJDUMP" -dr out/m1-3b4b/m68kdeb-takeover-68030-mmuprobe.o > out/m1-3b4b/m68kdeb-takeover-68030-mmuprobe.disasm
              grep -Eiq "movec.*cacr|cacr.*movec" out/m1-3b4b/m68kdeb-takeover-68030-mmuprobe.disasm
              grep -Eiq "pmove.*tc|tc.*pmove" out/m1-3b4b/m68kdeb-takeover-68030-mmuprobe.disasm
              grep -Eiq "pflusha" out/m1-3b4b/m68kdeb-takeover-68030-mmuprobe.disasm
            '

      - name: Upload reversible loader and isolated takeover objects
        uses: actions/upload-artifact@v4
        with:
          name: m1-3b4b-reversible-loader
          path: out/m1-3b4b/
