name: M1.3a.3 AROS amiboot runtime

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/m1_3a3-aros-amiboot-runtime.yml'
      - 'ci/fs-uae/m1_3a3_aros_amiboot.fs-uae'
      - 'ci/fs-uae/prepare-m1_3a3-runtime.sh'
      - 'kernel/build-amiga.sh'
      - 'initramfs/build-amiga.sh'
      - 'platforms/amiga/**'
      - 'scripts/check-amiga-bootstrap.sh'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl dpkg-dev flex \
            fs-uae gcc-m68k-linux-gnu gzip libelf-dev libssl-dev make netcat-openbsd \
            scrot socat unzip xvfb xorriso xz-utils
          fs-uae --version

      - name: Build M1.3 Amiga bundle
        run: |
          sh kernel/build-amiga.sh
          sh initramfs/build-amiga.sh
          sh platforms/amiga/fetch-amiboot.sh
          mkdir -p out/m68kdeb-amiga
          cp out/amiboot/amiboot out/m68kdeb-amiga/amiboot
          cp out/kernel-amiga/vmlinux-m68k-amiga out/m68kdeb-amiga/
          cp out/kernel-amiga/vmlinuz-m68k-amiga out/m68kdeb-amiga/
          cp out/initramfs-amiga/initramfs-m68kdeb.gz out/m68kdeb-amiga/
          cp platforms/amiga/bootstrap/Start-m68kDeb out/m68kdeb-amiga/
          cp platforms/amiga/bootstrap/Start-m68kDeb-Serial out/m68kdeb-amiga/
          chmod +x out/m68kdeb-amiga/Start-m68kDeb out/m68kdeb-amiga/Start-m68kDeb-Serial
          {
            echo 'M1.3a.3 runtime bundle provenance'
            echo "git=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo -n 'kernel_version='; cat out/kernel-amiga/VERSION
            echo -n 'kernel_source='; cat out/kernel-amiga/SOURCE_URL
            echo -n 'busybox_source='; cat out/initramfs-amiga/BUSYBOX_SOURCE_URL
            echo -n 'amiboot_source='; cat out/amiboot/SOURCE_URL
          } > out/m68kdeb-amiga/PROVENANCE.txt
          (cd out/m68kdeb-amiga && sha256sum amiboot vmlinux-m68k-amiga vmlinuz-m68k-amiga initramfs-m68kdeb.gz Start-m68kDeb Start-m68kDeb-Serial PROVENANCE.txt > SHA256SUMS)
          sh scripts/check-amiga-bootstrap.sh out/m68kdeb-amiga

      - name: Prepare pinned AROS runtime root
        run: sh ci/fs-uae/prepare-m1_3a3-runtime.sh

      - name: Boot AROS and m68kDeb under FS-UAE
        run: |
          mkdir -p out/m1-3a3/logs out/m1-3a3/screenshots
          xvfb-run -a sh -eu -c '
            fs-uae ci/fs-uae/m1_3a3_aros_amiboot.fs-uae >out/m1-3a3/fs-uae.stdout.log 2>&1 &
            emu=$!

            connected=0
            for i in $(seq 1 60); do
              if timeout 1 sh -c "exec 3<>/dev/tcp/127.0.0.1/1234" 2>/dev/null; then
                connected=1
                break
              fi
              sleep 1
            done
            [ "$connected" -eq 1 ] || {
              echo "serial listener did not appear" >&2
              cat out/m1-3a3/fs-uae.stdout.log >&2 || true
              kill -TERM "$emu" 2>/dev/null || true
              exit 1
            }

            # Reconnect with a persistent reader after the readiness probe.
            # FS-UAE accepts a new serial TCP client after the probe disconnects.
            timeout 360 socat - TCP:127.0.0.1:1234 >out/m1-3a3/serial.log 2>&1 &
            serial=$!

            found=0
            for i in $(seq 1 360); do
              if grep -Fq "M1.3 bootstrap reached userspace." out/m1-3a3/serial.log 2>/dev/null; then
                found=1
                break
              fi
              if ! kill -0 "$emu" 2>/dev/null; then
                echo "FS-UAE exited before runtime marker" >&2
                break
              fi
              sleep 1
            done

            scrot out/m1-3a3/screenshots/m1-3a3-runtime.png || true
            kill -TERM "$serial" 2>/dev/null || true
            kill -INT "$emu" 2>/dev/null || true
            sleep 2
            kill -TERM "$emu" 2>/dev/null || true
            wait "$serial" 2>/dev/null || true
            wait "$emu" 2>/dev/null || true

            if [ "$found" -ne 1 ]; then
              echo "M1.3 userspace marker not observed" >&2
              echo "=== serial ===" >&2
              cat out/m1-3a3/serial.log >&2 || true
              echo "=== fs-uae ===" >&2
              tail -200 out/m1-3a3/fs-uae.stdout.log >&2 || true
              exit 1
            fi
          '

      - name: Record runtime PASS
        run: |
          {
            echo "result=PASS"
            echo "git=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "machine=A3000"
            echo "cpu=68030+MMU"
            echo "motherboard_ram_kib=16384"
            echo "rom=AROS-20260908 amiga-m68k"
            echo "aros_payload_sha256=799a327bdd50c008c7d35fe57524876b0780d4db4caf8df1cea6fcaf123cd46b"
            echo "aros_iso_sha256=a9087e8095c58d554a4b3bc85dd35ac9d2da6954bcc066a419d8a7a06c358e65"
            echo "marker=M1.3 bootstrap reached userspace."
            fs-uae --version | head -n 1 | sed 's/^/fs_uae=/'
          } > out/m1-3a3/RESULT.txt

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-3a3-aros-amiboot-${{ github.sha }}
          path: |
            out/m1-3a3/
            out/m68kdeb-amiga/SHA256SUMS
            out/kernel-amiga/linux-source.SHA256
            out/initramfs-amiga/busybox-static.SHA256
            out/amiboot/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
