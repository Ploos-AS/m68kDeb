name: M1.3b.4b.6b 68030 PMMU Amiberry runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1_3b4b6b-pmmu-amiberry-runtime.yml'
      - 'ci/amiberry/m1_3b4b6b_aros_a1200_pmmu_smoke.uae'
      - 'ci/fs-uae/prepare-m1_3b4b6b-pmmu-smoke.sh'
      - 'loader/aros/m68kdeb-68030-pmmu-smoke-trampoline.S'
      - 'loader/aros/m68kdeb-68030-pmmu-smoke-qual.c'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl unzip xorriso xvfb \
            libflac-dev libmpeg2-4-dev libpng-dev libasound2-dev libmpg123-dev \
            libportmidi-dev libserialport-dev libenet-dev libpcap-dev libzstd-dev \
            libcurl4-openssl-dev nlohmann-json3-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Build SDL3 and Amiberry 8.3.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-3.2.8 https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/sdl3
          cmake --build /tmp/SDL3/build -j2
          cmake --install /tmp/SDL3/build
          git clone --depth 1 --branch release-3.2.4 https://github.com/libsdl-org/SDL_image.git /tmp/SDL3_image
          cmake -S /tmp/SDL3_image -B /tmp/SDL3_image/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/sdl3 -DCMAKE_PREFIX_PATH=/tmp/sdl3
          cmake --build /tmp/SDL3_image/build -j2
          cmake --install /tmp/SDL3_image/build
          git clone --depth 1 --branch v8.3.0 https://github.com/BlitterStudio/amiberry.git /tmp/amiberry
          # Amiberry v8.3.0 uses the pre-final SDL3 type name here. SDL 3.2.x
          # exposes SDL_RendererLogicalPresentation, matching the API used by
          # SDL_GetRenderLogicalPresentation. Keep this CI-only compatibility
          # patch narrow so the emulator core itself remains otherwise stock.
          grep -Fq 'SDL_LogicalPresentation lmode' /tmp/amiberry/src/osdep/sdl_renderer.cpp
          sed -i 's/SDL_LogicalPresentation lmode/SDL_RendererLogicalPresentation lmode/' /tmp/amiberry/src/osdep/sdl_renderer.cpp
          cmake -S /tmp/amiberry -B /tmp/amiberry/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/sdl3 \
            -DUSE_DBUS=OFF -DUSE_OPENGL=OFF -DUSE_VULKAN=OFF
          cmake --build /tmp/amiberry/build -j2
          cp /tmp/amiberry/build/amiberry /tmp/amiberry-bin
          /tmp/amiberry-bin --version || true

      - name: Build PMMU smoke blob and qualifier
        run: |
          mkdir -p out/m1-3b4b6b-pmmu
          docker pull amigadev/m68k-amigaos-gcc:latest
          docker run --rm -v "$PWD:/work" -w /work amigadev/m68k-amigaos-gcc:latest sh -lc '
            set -eu
            CC=$(find / -type f -name "m68k-amigaos-gcc" 2>/dev/null | head -n 1)
            NM=$(find / -type f -name "m68k-amigaos-nm" 2>/dev/null | head -n 1)
            OBJCOPY=$(find / -type f -name "m68k-amigaos-objcopy" 2>/dev/null | head -n 1)
            OBJDUMP=$(find / -type f -name "m68k-amigaos-objdump" 2>/dev/null | head -n 1)
            "$CC" -x assembler-with-cpp -c loader/aros/m68kdeb-68030-pmmu-smoke-trampoline.S -o out/m1-3b4b6b-pmmu/smoke.o -m68030 -m68851
            "$NM" -n out/m1-3b4b6b-pmmu/smoke.o > out/m1-3b4b6b-pmmu/smoke.nm
            "$OBJDUMP" -r out/m1-3b4b6b-pmmu/smoke.o > out/m1-3b4b6b-pmmu/smoke.relocs.txt
            "$OBJCOPY" -O binary -j .text out/m1-3b4b6b-pmmu/smoke.o out/m1-3b4b6b-pmmu/smoke.bin
          '
          ! grep -Eq '^[[:space:]]*[0-9a-fA-F]+[[:space:]]+R_' out/m1-3b4b6b-pmmu/smoke.relocs.txt
          python3 - <<'PY'
          from pathlib import Path
          data=Path('out/m1-3b4b6b-pmmu/smoke.bin').read_bytes()
          assert 0 < len(data) <= 4096
          body=','.join(f'0x{x:02x}' for x in data)
          Path('out/m1-3b4b6b-pmmu/smoke-blob.c').write_text(
              'unsigned char m68kdeb_pmmu_smoke_blob[]={' + body + '};\n'
              'unsigned int m68kdeb_pmmu_smoke_blob_len=sizeof(m68kdeb_pmmu_smoke_blob);\n')
          PY
          docker run --rm -v "$PWD:/work" -w /work amigadev/m68k-amigaos-gcc:latest sh -lc '
            set -eu
            CC=$(find / -type f -name "m68k-amigaos-gcc" 2>/dev/null | head -n 1)
            "$CC" loader/aros/m68kdeb-68030-pmmu-smoke-qual.c out/m1-3b4b6b-pmmu/smoke-blob.c -o out/m1-3b4b6b-pmmu/m68kdeb-68030-pmmu-smoke-qual -m68030 -Os -Wall -Wextra -Werror -Wno-error=pointer-sign -noixemul
          '

      - name: Prepare AROS runtime
        run: sh ci/fs-uae/prepare-m1_3b4b6b-pmmu-smoke.sh

      - name: Run PMMU smoke test on Amiberry 8.3.0
        shell: bash
        env:
          LD_LIBRARY_PATH: /tmp/sdl3/lib
        run: |
          set -euo pipefail
          timeout 150 xvfb-run -a /tmp/amiberry-bin -f ci/amiberry/m1_3b4b6b_aros_a1200_pmmu_smoke.uae \
            >out/m1-3b4b6b-pmmu/amiberry.stdout.log 2>out/m1-3b4b6b-pmmu/amiberry.stderr.log || true

      - name: Qualify PMMU alias instruction fetch
        shell: bash
        run: |
          set -euo pipefail
          root=out/m1-3b4b6b-pmmu/aros-root
          test -f "$root/m1-3b4b6b-pmmu-armed.marker"
          test -f "$root/m1-3b4b6b-pmmu-returned.marker"
          test -f "$root/m1-3b4b6b-pmmu-pass.marker"
          grep -Fq 'M68KDEB_PMMU_SMOKE_PASS' "$root/m68kdeb-pmmu-smoke-report.txt"
          echo 'PASS: Amiberry survived supervisor-program PMMU alias instruction fetch'

      - name: Upload Amiberry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-3b4b6b-pmmu-amiberry-evidence
          if-no-files-found: warn
          path: |
            out/m1-3b4b6b-pmmu/amiberry.stdout.log
            out/m1-3b4b6b-pmmu/amiberry.stderr.log
            out/m1-3b4b6b-pmmu/RUNTIME_PROVENANCE.txt
            out/m1-3b4b6b-pmmu/aros-root/m68kdeb-pmmu-smoke-report.txt
            out/m1-3b4b6b-pmmu/aros-root/m1-3b4b6b-pmmu-armed.marker
            out/m1-3b4b6b-pmmu/aros-root/m1-3b4b6b-pmmu-returned.marker
            out/m1-3b4b6b-pmmu/aros-root/m1-3b4b6b-pmmu-pass.marker
